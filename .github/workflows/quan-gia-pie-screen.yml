name: quan-gia-pie-threefold-screen

on:
  workflow_dispatch:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/quan-gia-pie-screen.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  play:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        opening:
          - auto
          - B1:CW
          - B1:CCW
          - B2:CW
          - B2:CCW
          - B3:CW
          - B3:CCW
          - B4:CW
          - B4:CCW
          - B5:CW
          - B5:CCW
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run opening screen
        run: >-
          npx tsx src/benchmarks/balance-mode-v3a-selfplay.ts
          --mode quan-gia-pie-threefold
          --opening '${{ matrix.opening }}'
          --case-id 'screen-${{ matrix.opening }}'
          --time-budget-ms 1200
          --simulation-cap 5000000
          --max-board-moves 240
          --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgpie-screen-${{ matrix.opening }}
          path: result.json
          retention-days: 3

  summarize:
    needs: play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qgpie-screen-*
          path: results
          merge-multiple: false
      - name: Build summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('results').glob('**/result.json')):
              rows.append(json.loads(p.read_text()))
          lines=['# Quan Gia + Pie + Threefold opening screen','', '| Opening request | Opening played | Winner A/B | Draw | Unresolved | Swap | Moves | Margin A |','|---|---|---|---:|---:|---:|---:|---:|']
          neutral=[]
          for r in rows:
              o=r['outcome']; req=r['methodology']['openingRequest']
              draw=(not o['unresolved'] and o['winnerAgent'] is None)
              if draw: neutral.append(req)
              lines.append(f"| {req} | {r['methodology']['openingPlayed']} | {o['winnerAgent'] or '-'} | {int(draw)} | {int(o['unresolved'])} | {int(r['swap']['used'])} | {o['boardMoves']} | {o['finalScoreMarginA']} |")
          lines += ['', 'Neutral/draw openings from this screen: ' + (', '.join(neutral) if neutral else 'none')]
          Path('qgpie-screen-summary.md').write_text('\n'.join(lines)+'\n')
          Path('qgpie-screen-summary.json').write_text(json.dumps({'neutral':neutral,'rows':rows}, indent=2)+'\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qgpie-screen-summary
          path: |
            qgpie-screen-summary.md
            qgpie-screen-summary.json
          retention-days: 7
