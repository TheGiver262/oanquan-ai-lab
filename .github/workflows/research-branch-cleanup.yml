name: temporary-research-branch-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/research-branch-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Delete obsolete research branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in \
            "research/balanced-mode-tournament" \
            "research/v3a2-target-mode-balance" \
            "research/v3a3-bounded-solved-tt"
          do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" || true
          done

      - name: Prune older completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          while true; do
            IDS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.status==\"completed\" and (.id|tostring) != \"$CURRENT_RUN\") | .id")"
            [ -z "$IDS" ] && break
            for id in $IDS; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
            done
          done

      - name: Remove temporary cleanup workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-branch-cleanup.yml
          git commit -m "chore: remove temporary research branch cleanup workflow"
          git push origin HEAD:main
