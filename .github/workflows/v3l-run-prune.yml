name: temporary-v3l-run-prune

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v3l-run-prune.yml"

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ids = [
              36317917296, 36317917295,
              36317827938, 36317822303, 36317817660,
              36317656836, 36317419294, 36317415244, 36317303144,
              36317266790, 36317263830, 36317192426, 36317188588,
              36317184740, 36317138821, 36317107136,
              36301675705, 36301675681
            ];
            for (const run_id of ids) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id,
                });
              } catch (error) {
                core.warning(`Could not delete run ${run_id}: ${error.message}`);
              }
            }
