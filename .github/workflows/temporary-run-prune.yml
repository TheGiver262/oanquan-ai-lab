name: temporary-run-prune

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-run-prune.yml"

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 35540309066 35539268529 35539268505 35536917078 35536917076 35535237679 35535237629 35535228350 35535228316 35534976331 35534976299 35534966976 35534948897 35534927956 35534531833 35534531795 35534520365 35534379768 35534379641 35534369758 35534336326 35533807456 35533752643 35726336231 35726406543 35726441407 35726441408; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
          done
