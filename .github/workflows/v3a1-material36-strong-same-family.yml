name: v3a1-material36-strong-same-family

on:
  push:
    branches:
      - research/puct-v3a1-leaf-score
    paths:
      - ".github/workflows/v3a1-material36-strong-same-family.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  gate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        stage: [stage1, stage2, stage3]
        budget: [20000, 50000]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: V3A.1 material36 vs incumbent V3A
        run: |
          npx tsx src/benchmarks/v3a1-vs-v3a-fixed.ts \
            --stage "${{ matrix.stage }}" \
            --fixed-simulations "${{ matrix.budget }}" \
            --candidate-leaf-score-weight 1.8 \
            --candidate-leaf-score-material-max 36 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-material36-${{ matrix.stage }}-${{ matrix.budget }}
          path: result.json
          retention-days: 7

  summarize:
    needs: gate
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v3a1-material36-*
          path: results
      - name: Build strong-gate summary
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:(r["methodology"]["fixedSimulationsPerDecision"],r["methodology"]["stage"]))
          md=["# V3A.1 material36 strong same-family gate","",
              "Candidate leafScoreMaterialMax=36 vs incumbent V3A (Infinity), equal fixed simulations per decision.","",
              "| sims | stage | games | cand W | inc W | draws | unresolved | pairs +/=/- | mean pair diff |",
              "|---:|---|---:|---:|---:|---:|---:|---|---:|"]
          grouped={}
          for r in rows:
              b=r["methodology"]["fixedSimulationsPerDecision"]
              grouped.setdefault(b,{"cw":0,"iw":0,"d":0,"u":0,"pairs":[]})
              g=grouped[b]
              g["cw"]+=r["candidateWins"]; g["iw"]+=r["incumbentWins"]; g["d"]+=r["draws"]; g["u"]+=r["unresolved"]; g["pairs"]+=r["pairDiffs"]
              md.append(f'| {b} | {r["methodology"]["stage"]} | {r["games"]} | {r["candidateWins"]} | {r["incumbentWins"]} | {r["draws"]} | {r["unresolved"]} | {r["favorablePairs"]}/{r["neutralPairs"]}/{r["unfavorablePairs"]} | {r["meanPairDiff"] if r["meanPairDiff"] is not None else "-"} |')
          md.append("")
          for b,g in sorted(grouped.items()):
              p=g["pairs"]
              fav=sum(x>0 for x in p); neu=sum(x==0 for x in p); unf=sum(x<0 for x in p)
              md += [f'## {b} simulations',
                     f'- Aggregate resolved W-D-L: **{g["cw"]}-{g["d"]}-{g["iw"]}**',
                     f'- Unresolved: **{g["u"]}**',
                     f'- Completed pairs +/=/-: **{fav}/{neu}/{unf}**',
                     f'- Mean pair diff: **{sum(p)/len(p) if p else "n/a"}**',""] 
          open("v3a1-material36-strong-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(rows,open("v3a1-material36-strong-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-material36-strong-summary
          path: |
            v3a1-material36-strong-summary.md
            v3a1-material36-strong-summary.json
          retention-days: 7
