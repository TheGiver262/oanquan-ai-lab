name: b3-move2-transition-fine-scan

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/b3-move2-transition-fine-scan.yml"
      - "src/benchmarks/b3-root-transition-audit.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/research/balance-modes.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scan:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: b61000
            budget: 61000
          - id: b62000
            budget: 62000
          - id: b63000
            budget: 63000
          - id: b64000
            budget: 64000
          - id: b65000
            budget: 65000
          - id: b66000
            budget: 66000
          - id: b67000
            budget: 67000
          - id: b68000
            budget: 68000
          - id: b69000
            budget: 69000
          - id: b98000
            budget: 98000
          - id: b99000
            budget: 99000
          - id: b99050
            budget: 99050
          - id: b99066
            budget: 99066
          - id: b99080
            budget: 99080
          - id: b99100
            budget: 99100
          - id: b99200
            budget: 99200
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Scan move-2 transition
        run: |
          npx tsx src/benchmarks/b3-root-transition-audit.ts \
            --opening B3:CW \
            --opener-agent A \
            --target-board-move 2 \
            --fixed-simulations "${{ matrix.budget }}" \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: move2-${{ matrix.id }}
          path: result.json
          retention-days: 7

  summarize:
    needs: scan
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: move2-*
          path: results
      - name: Build transition table
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:r["methodology"]["fixedSimulations"])
          md=["# B3 move-2 fine transition scan","",
              "Canonical B3:CW / opener A. The opening is forced; P1 and the move-2 root both use the same fixed budget. No continuation beyond move 2.","",
              "| budget | P1 reply | selected | B4:CW visits | B4 mean | B5:CCW visits | B5 mean | visit delta B5-B4 | mean delta B5-B4 |",
              "|---:|---|---|---:|---:|---:|---:|---:|---:|"]
          serial=[]
          for r in rows:
              stats={x["action"]:x for x in r["target"]["rootStats"]}
              b4=stats.get("B4:CW"); b5=stats.get("B5:CCW")
              if not b4 or not b5: raise SystemExit("missing expected move")
              rec={
                "budget":r["methodology"]["fixedSimulations"],
                "reply":r["prefix"][-1]["action"] if r["prefix"] else None,
                "selected":r["target"]["selectedAction"],
                "b4Visits":b4["visits"],"b4Mean":b4["meanValue"],
                "b5Visits":b5["visits"],"b5Mean":b5["meanValue"],
                "visitDelta":b5["visits"]-b4["visits"],
                "meanDelta":b5["meanValue"]-b4["meanValue"],
              }
              serial.append(rec)
              md.append(f'| {rec["budget"]} | {rec["reply"]} | {rec["selected"]} | {rec["b4Visits"]} | {rec["b4Mean"]:.6f} | {rec["b5Visits"]} | {rec["b5Mean"]:.6f} | {rec["visitDelta"]} | {rec["meanDelta"]:.6f} |')
          mean_cross=next((x for x in serial if x["meanDelta"]>0),None)
          visit_cross=next((x for x in serial if x["visitDelta"]>0),None)
          md += ["",
              f'- First sampled positive mean delta: **{mean_cross["budget"] if mean_cross else "none"}**',
              f'- First sampled positive visit delta / selected crossover: **{visit_cross["budget"] if visit_cross else "none"}**']
          report={"rows":serial,"firstPositiveMeanDelta":mean_cross,"firstPositiveVisitDelta":visit_cross}
          open("b3-move2-transition-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(report,open("b3-move2-transition-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-move2-transition-summary
          path: |
            b3-move2-transition-summary.md
            b3-move2-transition-summary.json
          retention-days: 7
