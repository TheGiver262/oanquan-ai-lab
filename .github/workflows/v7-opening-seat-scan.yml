name: v7-opening-seat-scan

on:
  workflow_dispatch:
  push:
    branches:
      - research/hybrid-exact-oracle-v6
    paths:
      - ".github/workflows/v7-opening-seat-scan.yml"

jobs:
  opening-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { opening: "B1:CW", tag: "B1-CW" }
          - { opening: "B1:CCW", tag: "B1-CCW" }
          - { opening: "B2:CW", tag: "B2-CW" }
          - { opening: "B2:CCW", tag: "B2-CCW" }
          - { opening: "B3:CW", tag: "B3-CW" }
          - { opening: "B3:CCW", tag: "B3-CCW" }
          - { opening: "B4:CW", tag: "B4-CW" }
          - { opening: "B4:CCW", tag: "B4-CCW" }
          - { opening: "B5:CW", tag: "B5-CW" }
          - { opening: "B5:CCW", tag: "B5-CCW" }
    name: opening-${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Same-engine stochastic seat scan
        shell: bash
        run: |
          mkdir -p results/v7-opening-scan
          npm run benchmark:v7:fairness -- \
            --opening "${{ matrix.opening }}" \
            --games 8 \
            --ms 350 \
            --simulations 100000 \
            --rollout-depth 20 \
            --max-moves 240 \
            --seed 20280908 \
            | tee "results/v7-opening-scan/${{ matrix.tag }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v7-opening-scan-${{ matrix.tag }}
          path: results/v7-opening-scan/*.json

  resource-fair-tn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { opening: "B3:CW", tag: "B3-CW" }
          - { opening: "B3:CCW", tag: "B3-CCW" }
    name: resource-fair-${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: UCT-PB vs Trạng Nguyên with relaxed search-node cap
        shell: bash
        run: |
          mkdir -p results/v7-resource-fair
          npm run benchmark:v7:strength -- \
            --a uct-pb \
            --b trang-nguyen \
            --opening "${{ matrix.opening }}" \
            --games 8 \
            --ms 1200 \
            --nodes 500000 \
            --simulations 200000 \
            --rollout-depth 20 \
            --pvs-depth 14 \
            --max-moves 200 \
            --seed 20280908 \
            | tee "results/v7-resource-fair/${{ matrix.tag }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v7-resource-fair-${{ matrix.tag }}
          path: results/v7-resource-fair/*.json
