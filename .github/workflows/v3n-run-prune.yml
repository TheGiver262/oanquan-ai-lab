name: temporary-v3n-run-prune

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v3n-run-prune.yml"

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ids = [
              36338853263,
              36338762510, 36338755809, 36338747550,
              36338504313, 36338500263,
              36338381543, 36338337832,
              36338297707, 36338297678, 36338294366,
              36338228611, 36338172553, 36338093615
            ];
            for (const run_id of ids) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id,
                });
              } catch (error) {
                core.warning(`Could not delete run ${run_id}: ${error.message}`);
              }
            }
