name: temporary-final-actions-prune

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/final-actions-prune.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Delete every completed historical run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            IDS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status=="completed") | .id')"
            [ -z "$IDS" ] && break
            for id in $IDS; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
            done
          done

      - name: Remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-actions-prune.yml
          git commit -m "chore: remove final Actions cleanup workflow"
          git push origin HEAD:research/balanced-mode-tournament
