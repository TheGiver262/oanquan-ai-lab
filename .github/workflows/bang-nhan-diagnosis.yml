name: bang-nhan-diagnosis

on:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Verify experiment matches production before fix
        run: npm test -- --run tests/bang-nhan-experiment-parity.test.ts tests/bang-nhan-ordering-regression.test.ts

  causal:
    needs: parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [uct, uct-pb]
        opponent_mode: [server-baseline, fixed-opponent-ordering]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Run isolated causal tournament
        run: |
          npx tsx src/benchmarks/bang-nhan-ordering-causal.ts \
            --variant ${{ matrix.variant }} \
            --opponent-mode ${{ matrix.opponent_mode }}
