name: puct-v3a-multiseed

on:
  push:
    branches:
      - research/gpn-puct-v3
    paths:
      - ".github/workflows/puct-v3a-multiseed.yml"
      - "src/research/puct-v3a.ts"
      - "src/research/mcts.ts"
      - "src/benchmarks/puct-v3-paired.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/puct-v3a.test.ts tests/research-mcts.test.ts tests/exact-endgame-v4.test.ts tests/endgame-graph-v4.test.ts
      - run: npm run build

  benchmark:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        seed: [20260921, 20260922, 20260923, 20260924]
        matchup: [puct-v3a-vs-puct-v2, puct-v2-mirror]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Configure matchup
        id: matchup
        shell: bash
        run: |
          if [ "${{ matrix.matchup }}" = "puct-v3a-vs-puct-v2" ]; then
            echo "research=puct-v3a" >> "$GITHUB_OUTPUT"
            echo "opponent=puct-v2" >> "$GITHUB_OUTPUT"
          else
            echo "research=puct-v2" >> "$GITHUB_OUTPUT"
            echo "opponent=puct-v2" >> "$GITHUB_OUTPUT"
          fi
      - name: Run paired benchmark
        run: >-
          npm run benchmark:puct:v3 --
          --research ${{ steps.matchup.outputs.research }}
          --opponent ${{ steps.matchup.outputs.opponent }}
          --openings B3:CW,B3:CCW
          --reply-corpus
          --pairs 1
          --simulations 100000
          --rollout-depth 20
          --cpuct 1.5
          --policy-temperature 0.6
          --research-ms 600
          --opponent-ms 600
          --opponent-nodes 100000
          --max-moves 160
          --seed ${{ matrix.seed }}
          --out multiseed-${{ matrix.matchup }}-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: multiseed-${{ matrix.matchup }}-${{ matrix.seed }}
          path: multiseed-${{ matrix.matchup }}-${{ matrix.seed }}.json
