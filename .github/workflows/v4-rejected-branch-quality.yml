name: v4-rejected-branch-quality

on:
  push:
    branches:
      - research/puct-v4-quiescence
    paths:
      - ".github/workflows/v4-rejected-branch-quality.yml"
      - "src/benchmarks/v4-rejected-branch-quality.ts"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        budget: [20000, 50000]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Validate reflected branch quality
        run: >-
          npx tsx src/benchmarks/v4-rejected-branch-quality.ts
          --fixed-simulations ${{ matrix.budget }}
          --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4-rejected-branch-quality-${{ matrix.budget }}
          path: result.json
          retention-days: 7
