name: puct-v2-strength

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: tham-hoa
            opponent: tham-hoa
            pairs: 3
            budget: 600
            nodes: 36000
          - id: trang-nguyen
            opponent: trang-nguyen
            pairs: 2
            budget: 1200
            nodes: 100000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: mkdir -p results/puct-v2-strength
      - name: Paired PUCT V2 vs ${{ matrix.id }}
        run: >-
          npm run benchmark:puct:paired --
          --opponent ${{ matrix.opponent }}
          --openings B3:CW,B3:CCW
          --pairs ${{ matrix.pairs }}
          --simulations 100000
          --research-ms ${{ matrix.budget }}
          --opponent-ms ${{ matrix.budget }}
          --opponent-nodes ${{ matrix.nodes }}
          --rollout-depth 20
          --cpuct 1.5
          --policy-temperature 0.6
          --max-moves 160
          --seed 20260913
          --out results/puct-v2-strength/${{ matrix.id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: puct-v2-strength-${{ matrix.id }}
          path: results/puct-v2-strength/*.json
