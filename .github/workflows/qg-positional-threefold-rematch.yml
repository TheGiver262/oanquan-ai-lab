name: qg-positional-threefold-rematch

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/qg-positional-threefold-rematch.yml"
      - "src/research/balance-modes.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/benchmarks/balance-mode-v3a-selfplay.ts"
      - "src/types.ts"
      - "tests/balance-modes.test.ts"
      - "tests/mode-aware-puct-v3a.test.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  play:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        opening:
          - B1-CW
          - B1-CCW
          - B2-CW
          - B2-CCW
          - B3-CW
          - B3-CCW
          - B4-CW
          - B4-CCW
          - B5-CW
          - B5-CCW
        opener_agent:
          - A
          - B
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run positional-threefold case
        shell: bash
        run: |
          OPENING='${{ matrix.opening }}'
          OPENING="${OPENING/-/:}"
          npx tsx src/benchmarks/balance-mode-v3a-selfplay.ts \
            --mode quan-gia-positional-threefold \
            --opening "$OPENING" \
            --opener-agent '${{ matrix.opener_agent }}' \
            --case-id 'qg-positional-${{ matrix.opening }}-${{ matrix.opener_agent }}' \
            --fixed-simulations 20000 \
            --max-board-moves 240 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qgpos-${{ matrix.opening }}-${{ matrix.opener_agent }}
          path: result.json
          retention-days: 7

  summarize:
    needs: play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qgpos-*
          path: results
      - name: Build positional-threefold summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path("results").glob("**/result.json"))]
          openings=[f"B{i}:{d}" for i in range(1,6) for d in ("CW","CCW")]
          mirror_classes=[("B1:CW","B5:CCW"),("B1:CCW","B5:CW"),("B2:CW","B4:CCW"),("B2:CCW","B4:CW"),("B3:CW","B3:CCW")]
          index={(r["methodology"]["openingPlayed"],r["methodology"]["originalOpenerAgent"]):r for r in rows}
          def label(r):
              o=r["outcome"]
              if o["unresolved"]: return "U"
              if o["winnerAgent"] is None: return "D"
              return "OW" if o["openerAgentValue"]==1 else "RW"
          def sig(r):
              return (label(r),r["outcome"]["finalOpenerMargin"],r["outcome"]["boardMoves"],r["outcome"]["finishReason"])
          totals={"opener_wins":0,"responder_wins":0,"draws":0,"unresolved":0,"positional_finishes":0}
          for r in rows:
              l=label(r)
              if l=="OW": totals["opener_wins"]+=1
              elif l=="RW": totals["responder_wins"]+=1
              elif l=="D": totals["draws"]+=1
              else: totals["unresolved"]+=1
              totals["positional_finishes"] += int(r["outcome"]["finishReason"]=="repeated_position")
          mismatches=[]
          for left,right in mirror_classes:
              for agent in ("A","B"):
                  a=index[(left,agent)]; b=index[(right,agent)]
                  if sig(a)!=sig(b):
                      mismatches.append({"left":left,"right":right,"agent":agent,"leftSig":sig(a),"rightSig":sig(b)})
          identity=[]
          for op in openings:
              a=index[(op,"A")]; b=index[(op,"B")]
              if label(a)!=label(b): identity.append(op)
          md=["# Quan Gia + Positional Threefold rematch","",
              "Reflection-canonical V3A, fixed 20,000 simulations/decision, no wall-clock cutoff, 240-move censor cap.","",
              f"- Games: **{len(rows)}/20**",
              f"- Opener wins: **{totals['opener_wins']}**",
              f"- Responder wins: **{totals['responder_wins']}**",
              f"- Draws: **{totals['draws']}**",
              f"- Unresolved: **{totals['unresolved']}**",
              f"- Positional repetition finishes: **{totals['positional_finishes']}**",
              f"- Reflection mismatches: **{len(mismatches)}/10**",
              f"- A/B result mismatches: **{len(identity)}/10**","",
              "| Opening | A opens | B opens | Margin A/B | Moves A/B | Finish A/B |",
              "|---|---|---|---|---|---|"]
          opening_data={}
          for op in openings:
              a=index[(op,"A")]; b=index[(op,"B")]
              md.append(f"| {op} | {label(a)} | {label(b)} | {a['outcome']['finalOpenerMargin']}/{b['outcome']['finalOpenerMargin']} | {a['outcome']['boardMoves']}/{b['outcome']['boardMoves']} | {a['outcome']['finishReason']}/{b['outcome']['finishReason']} |")
              opening_data[op]={"A":a,"B":b}
          report={"games":len(rows),"totals":totals,"reflectionMismatches":mismatches,"identityMismatches":identity,"openings":opening_data}
          Path("qg-positional-threefold-summary.md").write_text("\n".join(md)+"\n")
          Path("qg-positional-threefold-summary.json").write_text(json.dumps(report,indent=2)+"\n")
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qg-positional-threefold-summary
          path: |
            qg-positional-threefold-summary.md
            qg-positional-threefold-summary.json
          retention-days: 7
