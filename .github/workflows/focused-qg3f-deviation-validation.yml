name: focused-qg3f-deviation-validation

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - "src/benchmarks/forced-deviation-selfplay.ts"
      - ".github/workflows/focused-qg3f-deviation-validation.yml"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/research/balance-modes.ts"
      - "src/engine.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  validate:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: m2-cw-A-20000
            candidate: m2-draw
            opening: B3:CW
            force_move: 2
            force_action: B1:CW
            opener: A
            sims: 20000
            cap: 240
          - id: m2-ccw-A-20000
            candidate: m2-draw
            opening: B3:CCW
            force_move: 2
            force_action: B5:CCW
            opener: A
            sims: 20000
            cap: 240
          - id: m2-cw-B-20000
            candidate: m2-draw
            opening: B3:CW
            force_move: 2
            force_action: B1:CW
            opener: B
            sims: 20000
            cap: 240
          - id: m2-ccw-B-20000
            candidate: m2-draw
            opening: B3:CCW
            force_move: 2
            force_action: B5:CCW
            opener: B
            sims: 20000
            cap: 240
          - id: m2-cw-A-50000
            candidate: m2-draw
            opening: B3:CW
            force_move: 2
            force_action: B1:CW
            opener: A
            sims: 50000
            cap: 240
          - id: m2-ccw-A-50000
            candidate: m2-draw
            opening: B3:CCW
            force_move: 2
            force_action: B5:CCW
            opener: A
            sims: 50000
            cap: 240
          - id: m2-cw-B-50000
            candidate: m2-draw
            opening: B3:CW
            force_move: 2
            force_action: B1:CW
            opener: B
            sims: 50000
            cap: 240
          - id: m2-ccw-B-50000
            candidate: m2-draw
            opening: B3:CCW
            force_move: 2
            force_action: B5:CCW
            opener: B
            sims: 50000
            cap: 240
          - id: m2-cw-A-100000
            candidate: m2-draw
            opening: B3:CW
            force_move: 2
            force_action: B1:CW
            opener: A
            sims: 100000
            cap: 240
          - id: m2-ccw-A-100000
            candidate: m2-draw
            opening: B3:CCW
            force_move: 2
            force_action: B5:CCW
            opener: A
            sims: 100000
            cap: 240
          - id: m2-cw-B-100000
            candidate: m2-draw
            opening: B3:CW
            force_move: 2
            force_action: B1:CW
            opener: B
            sims: 100000
            cap: 240
          - id: m2-ccw-B-100000
            candidate: m2-draw
            opening: B3:CCW
            force_move: 2
            force_action: B5:CCW
            opener: B
            sims: 100000
            cap: 240
          - id: m4-cw-A-20000
            candidate: m4-long
            opening: B3:CW
            force_move: 4
            force_action: B3:CCW
            opener: A
            sims: 20000
            cap: 480
          - id: m4-ccw-A-20000
            candidate: m4-long
            opening: B3:CCW
            force_move: 4
            force_action: B3:CW
            opener: A
            sims: 20000
            cap: 480
          - id: m4-cw-B-20000
            candidate: m4-long
            opening: B3:CW
            force_move: 4
            force_action: B3:CCW
            opener: B
            sims: 20000
            cap: 480
          - id: m4-ccw-B-20000
            candidate: m4-long
            opening: B3:CCW
            force_move: 4
            force_action: B3:CW
            opener: B
            sims: 20000
            cap: 480
          - id: m4-cw-A-50000
            candidate: m4-long
            opening: B3:CW
            force_move: 4
            force_action: B3:CCW
            opener: A
            sims: 50000
            cap: 480
          - id: m4-ccw-A-50000
            candidate: m4-long
            opening: B3:CCW
            force_move: 4
            force_action: B3:CW
            opener: A
            sims: 50000
            cap: 480
          - id: m4-cw-B-50000
            candidate: m4-long
            opening: B3:CW
            force_move: 4
            force_action: B3:CCW
            opener: B
            sims: 50000
            cap: 480
          - id: m4-ccw-B-50000
            candidate: m4-long
            opening: B3:CCW
            force_move: 4
            force_action: B3:CW
            opener: B
            sims: 50000
            cap: 480
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate forced deviation with persistent V3A trees
        run: |
          npx tsx src/benchmarks/forced-deviation-selfplay.ts \
            --mode quan-gia-threefold \
            --opening "${{ matrix.opening }}" \
            --force-board-move "${{ matrix.force_move }}" \
            --force-action "${{ matrix.force_action }}" \
            --opener-agent "${{ matrix.opener }}" \
            --fixed-simulations "${{ matrix.sims }}" \
            --max-board-moves "${{ matrix.cap }}" \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: focused-${{ matrix.id }}
          path: result.json
          retention-days: 7

  summarize:
    needs: validate
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: focused-*
          path: results
      - name: Build focused validation report
        run: |
          python - <<'PY'
          import glob,json
          docs=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: docs.append(json.load(f))
          def candidate(d):
              return "m2-draw" if d["force"]["boardMove"]==2 else "m4-long"
          docs.sort(key=lambda d:(candidate(d),d["config"]["fixedSimulations"],d["opening"],d["openerAgent"]))
          md=["# Focused QG3F deviation validation","",
              "Persistent reflection-canonical V3A trees. Forced tactical resource is applied only at the target move; all earlier/later decisions use the requested fixed simulation budget.","",
              "| candidate | sims | opening | opener id | recommended | forced rank | legal | outcome | margin | moves |",
              "|---|---:|---|---|---|---:|---|---|---:|---:|"]
          for d in docs:
              fd=d["force"]["diagnostics"] or {}
              md.append(f'| {candidate(d)} | {d["config"]["fixedSimulations"]} | {d["opening"]} | {d["openerAgent"]} | {fd.get("recommendedAction")} | {fd.get("forcedRank")} | {d["force"]["legal"]} | {d["outcome"]["openerValue"]} | {d["outcome"]["openerMargin"]} | {d["outcome"]["boardMoves"]} |')
          md += ["","## Integrity",""]
          for cand in ["m2-draw","m4-long"]:
              subset=[d for d in docs if candidate(d)==cand]
              by={}
              for d in subset:
                  by[(d["config"]["fixedSimulations"],d["openerAgent"],d["opening"])]=d
              mismatches=0
              identities=0
              for sims in sorted(set(d["config"]["fixedSimulations"] for d in subset)):
                  for agent in ["A","B"]:
                      a=by.get((sims,agent,"B3:CW")); b=by.get((sims,agent,"B3:CCW"))
                      if a and b and (a["outcome"]["openerValue"],a["outcome"]["openerMargin"],a["outcome"]["boardMoves"]) != (b["outcome"]["openerValue"],b["outcome"]["openerMargin"],b["outcome"]["boardMoves"]):
                          mismatches += 1
                  a=by.get((sims,"A","B3:CW")); b=by.get((sims,"B","B3:CW"))
                  if a and b and (a["outcome"]["openerValue"],a["outcome"]["openerMargin"]) != (b["outcome"]["openerValue"],b["outcome"]["openerMargin"]):
                      identities += 1
              md += [f'- {cand}: reflection mismatches **{mismatches}**, A/B result mismatches **{identities}**']
          with open("focused-qg3f-deviation-summary.md","w",encoding="utf-8") as f:f.write("\n".join(md)+"\n")
          with open("focused-qg3f-deviation-summary.json","w",encoding="utf-8") as f:json.dump(docs,f,indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: focused-qg3f-deviation-summary
          path: |
            focused-qg3f-deviation-summary.md
            focused-qg3f-deviation-summary.json
          retention-days: 7
