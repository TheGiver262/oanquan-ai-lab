name: quan-gia-threefold-filtered-paired

on:
  workflow_dispatch:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/quan-gia-threefold-filtered-paired.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  play:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        opening:
          - B1-CCW
          - B2-CW
          - B2-CCW
          - B3-CW
          - B3-CCW
          - B4-CW
          - B4-CCW
          - B5-CW
        opener_agent:
          - A
          - B
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run filtered Quan Gia Threefold paired case
        shell: bash
        run: |
          OPENING='${{ matrix.opening }}'
          OPENING="${OPENING/-/:}"
          npx tsx src/benchmarks/balance-mode-v3a-selfplay.ts \
            --mode quan-gia-threefold \
            --opening "$OPENING" \
            --opener-agent '${{ matrix.opener_agent }}' \
            --case-id 'qg3f-filtered-${{ matrix.opening }}-${{ matrix.opener_agent }}' \
            --time-budget-ms 1200 \
            --simulation-cap 5000000 \
            --max-board-moves 240 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: qg3f-filtered-${{ matrix.opening }}-${{ matrix.opener_agent }}
          path: result.json
          retention-days: 3

  summarize:
    needs: play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qg3f-filtered-*
          path: results
          merge-multiple: false
      - name: Build filtered paired summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          rows=[json.loads(p.read_text()) for p in sorted(Path('results').glob('**/result.json'))]
          by_opening=defaultdict(dict)
          role={'opener_wins':0,'responder_wins':0,'draws':0,'unresolved':0}
          agents={'A':{'wins':0,'losses':0,'draws':0},'B':{'wins':0,'losses':0,'draws':0}}
          opener_identity={'A':{'wins':0,'losses':0,'draws':0,'unresolved':0},'B':{'wins':0,'losses':0,'draws':0,'unresolved':0}}

          for r in rows:
              m=r['methodology']; o=r['outcome']; opener=m['originalOpenerAgent']; responder=m['originalResponderAgent']; opening=m['openingPlayed']
              by_opening[opening][opener]=r
              if o['unresolved']:
                  role['unresolved'] += 1
                  opener_identity[opener]['unresolved'] += 1
              elif o['winnerAgent'] is None:
                  role['draws'] += 1
                  agents['A']['draws'] += 1; agents['B']['draws'] += 1
                  opener_identity[opener]['draws'] += 1
              elif o['winnerAgent'] == opener:
                  role['opener_wins'] += 1
                  agents[opener]['wins'] += 1; agents[responder]['losses'] += 1
                  opener_identity[opener]['wins'] += 1
              else:
                  role['responder_wins'] += 1
                  agents[responder]['wins'] += 1; agents[opener]['losses'] += 1
                  opener_identity[opener]['losses'] += 1

          def label(r):
              if not r: return '-'
              o=r['outcome']
              if o['unresolved']: return 'U'
              if o['winnerAgent'] is None: return 'D'
              return 'OW' if o['openerAgentValue']==1 else 'RW'

          order=['B1:CCW','B2:CW','B2:CCW','B3:CW','B3:CCW','B4:CW','B4:CCW','B5:CW']
          lines=[
            '# Quan Gia + Threefold — filtered openings paired-seat test','',
            'Excluded as previously clear P0-weak openings: B1:CW and B5:CCW. No Pie. Frozen mode-aware PUCT V3A on both sides; 1200 ms/decision; 5,000,000 simulation cap; 240 board-move censor cap.','',
            '| Opening | A opens | B opens | Pair | Moves A/B | Opener margin A/B |','|---|---|---|---|---|---|'
          ]
          drawdraw=0; identity_disagreement=0
          for op in order:
              a=by_opening.get(op,{}).get('A'); b=by_opening.get(op,{}).get('B')
              la,lb=label(a),label(b)
              if la=='D' and lb=='D': drawdraw += 1
              if la != lb: identity_disagreement += 1
              pair=f'{la}/{lb}'
              am='-' if not a else a['outcome']['finalOpenerMargin']
              bm='-' if not b else b['outcome']['finalOpenerMargin']
              an='-' if not a else a['outcome']['boardMoves']
              bn='-' if not b else b['outcome']['boardMoves']
              lines.append(f'| {op} | {la} | {lb} | {pair} | {an}/{bn} | {am}/{bm} |')

          lines += ['', '## Role totals','',
                    f"- Games: {len(rows)}/16",
                    f"- Opener wins: {role['opener_wins']}",
                    f"- Responder wins: {role['responder_wins']}",
                    f"- Draws: {role['draws']}",
                    f"- Unresolved: {role['unresolved']}",
                    f"- DRAW/DRAW opening pairs: {drawdraw}/8",
                    f"- Identity-result disagreements: {identity_disagreement}/8",
                    '', '## Agent totals','',
                    f"- A: {agents['A']['wins']}W-{agents['A']['losses']}L-{agents['A']['draws']}D",
                    f"- B: {agents['B']['wins']}W-{agents['B']['losses']}L-{agents['B']['draws']}D",
                    '', '## By opener identity','',
                    f"- A opens: {opener_identity['A']['wins']}W-{opener_identity['A']['losses']}L-{opener_identity['A']['draws']}D-{opener_identity['A']['unresolved']}U",
                    f"- B opens: {opener_identity['B']['wins']}W-{opener_identity['B']['losses']}L-{opener_identity['B']['draws']}D-{opener_identity['B']['unresolved']}U"]

          summary={'mode':'quan-gia-threefold','excluded_openings':['B1:CW','B5:CCW'],'games':len(rows),'role':role,'agents':agents,'by_opener_identity':opener_identity,'draw_draw_pairs':drawdraw,'identity_result_disagreements':identity_disagreement}
          Path('qg3f-filtered-paired-summary.md').write_text('\n'.join(lines)+'\n')
          Path('qg3f-filtered-paired-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qg3f-filtered-paired-summary
          path: |
            qg3f-filtered-paired-summary.md
            qg3f-filtered-paired-summary.json
          retention-days: 7
