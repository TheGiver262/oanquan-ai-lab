name: temporary-delete-v5b-branch

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/delete-v5b-branch.yml"

permissions:
  contents: write

jobs:
  delete-v5b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Delete closed V5-B research branch
        run: git push origin --delete research/puct-v5b-shared-state-q
