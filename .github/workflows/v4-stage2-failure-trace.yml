name: v4-stage2-failure-trace

on:
  push:
    branches:
      - research/puct-v4-quiescence
    paths:
      - ".github/workflows/v4-stage2-failure-trace.yml"
      - "src/benchmarks/v4-stage2-failure-trace.ts"
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Trace reflected Stage-2 V4 failures
        run: >-
          npx tsx src/benchmarks/v4-stage2-failure-trace.ts
          --fixed-simulations 10000
          --out v4-stage2-failure-trace.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4-stage2-failure-trace
          path: v4-stage2-failure-trace.json
          retention-days: 7
