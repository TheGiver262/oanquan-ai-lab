name: puct-v3a-smoke

on:
  push:
    branches:
      - research/gpn-puct-v3
    paths:
      - ".github/workflows/puct-v3a-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: puct-v2-mirror
            research: puct-v2
            opponent: puct-v2
            research_ms: 75
            opponent_ms: 75
            opponent_nodes: 100000
          - id: puct-v3a-vs-puct-v2
            research: puct-v3a
            opponent: puct-v2
            research_ms: 75
            opponent_ms: 75
            opponent_nodes: 100000
          - id: puct-v3a-vs-uct-pb
            research: puct-v3a
            opponent: uct-pb
            research_ms: 75
            opponent_ms: 75
            opponent_nodes: 100000
          - id: puct-v3a-vs-trang-nguyen
            research: puct-v3a
            opponent: trang-nguyen
            research_ms: 100
            opponent_ms: 100
            opponent_nodes: 100000
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run smoke paired benchmark
        run: >-
          npm run benchmark:puct:v3 --
          --research ${{ matrix.research }}
          --opponent ${{ matrix.opponent }}
          --openings B3:CW,B3:CCW
          --pairs 1
          --simulations 100000
          --rollout-depth 20
          --cpuct 1.5
          --policy-temperature 0.6
          --research-ms ${{ matrix.research_ms }}
          --opponent-ms ${{ matrix.opponent_ms }}
          --opponent-nodes ${{ matrix.opponent_nodes }}
          --max-moves 160
          --seed 20260911
          --out puct-v3a-smoke-${{ matrix.id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: puct-v3a-smoke-${{ matrix.id }}
          path: puct-v3a-smoke-${{ matrix.id }}.json
