name: b3-move2-fair-branch-comparison

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/b3-move2-fair-branch-comparison.yml"
      - "src/benchmarks/b3-move2-fair-branch-comparison.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/research/balance-modes.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: b68000
            budget: 68000
          - id: b80000
            budget: 80000
          - id: b90000
            budget: 90000
          - id: b99000
            budget: 99000
          - id: b99066
            budget: 99066
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Compare B4 and B5 branches fairly
        run: |
          npx tsx src/benchmarks/b3-move2-fair-branch-comparison.ts \
            --opening B3:CW \
            --opener-agent A \
            --target-board-move 2 \
            --action-a B4:CW \
            --action-b B5:CCW \
            --fixed-simulations "${{ matrix.budget }}" \
            --max-board-moves 240 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: move2fair-${{ matrix.id }}
          path: result.json
          retention-days: 7

  summarize:
    needs: compare
    if: always() && needs.compare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: move2fair-*
          path: results
      - name: Build fair branch summary
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:r["methodology"]["fixedSimulations"])
          def lab(o):
              if o["unresolved"]: return "U"
              if o["openerValue"]==1:return "OW"
              if o["openerValue"]==0:return "D"
              return "RW"
          md=["# B3 move-2 fair branch comparison","",
              "Canonical B3:CW / opener A. The exact move-2 state is reached with the same fixed budget used for both continuations. Both B4:CW and B5:CCW branches are evaluated by fresh vanilla V3A for both players; no ResourceAware continuation is used.","",
              "| budget | root selected | B4 rank/visits/mean | B5 rank/visits/mean | B4 result | B4 margin | B4 moves | B5 result | B5 margin | B5 moves |",
              "|---:|---|---|---|---|---:|---:|---|---:|---:|"]
          for r in rows:
              a=r["root"]["actionA"]; b=r["root"]["actionB"]
              oa=r["branches"]["actionA"]; ob=r["branches"]["actionB"]
              md.append(f'| {r["methodology"]["fixedSimulations"]} | {r["root"]["selectedAction"]} | {a["rank"]}/{a["visits"]}/{a["meanValue"]:.4f} | {b["rank"]}/{b["visits"]}/{b["meanValue"]:.4f} | {lab(oa)} | {oa["openerMargin"]} | {oa["boardMoves"]} | {lab(ob)} | {ob["openerMargin"]} | {ob["boardMoves"]} |')
          json.dump(rows,open("b3-move2-fair-branch-summary.json","w",encoding="utf-8"),indent=2)
          open("b3-move2-fair-branch-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-move2-fair-branch-summary
          path: |
            b3-move2-fair-branch-summary.md
            b3-move2-fair-branch-summary.json
          retention-days: 7
