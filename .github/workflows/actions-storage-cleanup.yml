name: temporary-actions-storage-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/actions-storage-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Measure and delete Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Artifacts before:"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"             --jq '{count:.total_count, bytes:([.artifacts[].size_in_bytes] | add // 0)}'

          while true; do
            IDS="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"               --jq '.artifacts[].id')"
            [ -z "$IDS" ] && break
            for id in $IDS; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
          done

          echo "Artifacts after:"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"             --jq '{count:.total_count, bytes:([.artifacts[].size_in_bytes] | add // 0)}'

      - name: Delete all Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --limit 10000 || true
          gh cache delete --all --confirm || true
          echo "Caches after cleanup:"
          gh cache list --limit 10000 || true

      - name: Prune completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          while true; do
            IDS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"               --jq ".workflow_runs[] | select(.status==\"completed\" and (.id|tostring) != \"$CURRENT_RUN\") | .id")"
            [ -z "$IDS" ] && break
            for id in $IDS; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
            done
          done

      - name: Remove temporary cleanup workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/actions-storage-cleanup.yml
          git commit -m "chore: remove temporary Actions storage cleanup workflow"
          git push origin HEAD:main
