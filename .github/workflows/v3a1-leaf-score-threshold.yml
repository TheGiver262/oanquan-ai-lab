name: v3a1-leaf-score-threshold

on:
  push:
    branches:
      - research/puct-v3a1-leaf-score
    paths:
      - ".github/workflows/v3a1-leaf-score-threshold.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scan:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        weight: [0.25, 0.5, 0.75, 0.9]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Scan move-2 leaf score threshold
        run: |
          npx tsx src/benchmarks/v3a1-leaf-score-root-ablation.ts \
            --case move2 \
            --fixed-simulations 99066 \
            --leaf-score-weight "${{ matrix.weight }}" \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-threshold-${{ matrix.weight }}
          path: result.json
          retention-days: 7

  summarize:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v3a1-threshold-*
          path: results
      - name: Build threshold summary
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for path in glob.glob("results/**/result.json",recursive=True):
              with open(path,encoding="utf-8") as f:
                  rows.append(json.load(f))
          rows.sort(key=lambda r:r["methodology"]["leafScoreWeight"])
          md=[
            "# V3A.1 leaf-score threshold scan",
            "",
            "| weight | selected | B4 visits/mean | B5 visits/mean | visit delta B4-B5 | mean delta B4-B5 |",
            "|---:|---|---|---|---:|---:|",
          ]
          serial=[]
          for r in rows:
              focus={x["action"]:x["stats"] for x in r["focus"]}
              b4=focus["B4:CW"]; b5=focus["B5:CCW"]
              rec={
                "weight":r["methodology"]["leafScoreWeight"],
                "selected":r["selectedAction"],
                "b4Visits":b4["visits"],"b4Mean":b4["meanValue"],
                "b5Visits":b5["visits"],"b5Mean":b5["meanValue"],
                "visitDelta":b4["visits"]-b5["visits"],
                "meanDelta":b4["meanValue"]-b5["meanValue"],
              }
              serial.append(rec)
              md.append(
                f'| {rec["weight"]} | {rec["selected"]} | {rec["b4Visits"]}/{rec["b4Mean"]:.6f} | '
                f'{rec["b5Visits"]}/{rec["b5Mean"]:.6f} | {rec["visitDelta"]} | {rec["meanDelta"]:.6f} |'
              )
          open("v3a1-leaf-score-threshold-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(serial,open("v3a1-leaf-score-threshold-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-leaf-score-threshold-summary
          path: |
            v3a1-leaf-score-threshold-summary.md
            v3a1-leaf-score-threshold-summary.json
          retention-days: 7
