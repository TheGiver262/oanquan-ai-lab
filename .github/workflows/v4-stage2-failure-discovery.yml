name: v4-stage2-failure-discovery

on:
  push:
    branches:
      - research/puct-v4-quiescence
    paths:
      - ".github/workflows/v4-stage2-failure-discovery.yml"
      - "src/benchmarks/v4-v3a1-root-disagreements.ts"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Collect Stage-2 root disagreements
        run: >-
          npx tsx src/benchmarks/v4-v3a1-root-disagreements.ts
          --stage stage2
          --fixed-simulations 10000
          --out v4-stage2-disagreements.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4-stage2-failure-disagreements
          path: v4-stage2-disagreements.json
          retention-days: 7
