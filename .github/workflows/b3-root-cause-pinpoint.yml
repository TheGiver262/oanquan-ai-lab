name: b3-root-cause-pinpoint

on:
  push:
    branches:
      - research/b3-root-cause-pinpoint
    paths:
      - ".github/workflows/b3-root-cause-pinpoint.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  root99066:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Pinpoint move-2 optimistic subtree
        run: |
          npx tsx src/benchmarks/b3-root-leaf-provenance-audit.ts \
            --opening B3:CW \
            --opener-agent A \
            --target-board-move 2 \
            --fixed-simulations 99066 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: root99066
          path: result.json
          retention-days: 7

  deep34:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        budget: [80000, 90000]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Pinpoint move-34 phase transition
        run: |
          npx tsx src/benchmarks/b3-deep-move34-causal-audit.ts \
            --fixed-simulations "${{ matrix.budget }}" \
            --max-board-moves 240 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: deep34-${{ matrix.budget }}
          path: result.json
          retention-days: 7
