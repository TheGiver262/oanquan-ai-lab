name: b3-puct-crossplay

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/b3-puct-crossplay.yml"
      - "src/benchmarks/b3-puct-crossplay.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/research/balance-modes.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  play:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: candidate-opener-B3-CW-A
            role: candidate-opener
            opening: B3:CW
            opener: A
            opener_c: 2.5
            opener_t: 0.8
            opener_label: candidate
            responder_c: 1.5
            responder_t: 0.6
            responder_label: baseline
          - id: candidate-opener-B3-CW-B
            role: candidate-opener
            opening: B3:CW
            opener: B
            opener_c: 2.5
            opener_t: 0.8
            opener_label: candidate
            responder_c: 1.5
            responder_t: 0.6
            responder_label: baseline
          - id: candidate-opener-B3-CCW-A
            role: candidate-opener
            opening: B3:CCW
            opener: A
            opener_c: 2.5
            opener_t: 0.8
            opener_label: candidate
            responder_c: 1.5
            responder_t: 0.6
            responder_label: baseline
          - id: candidate-opener-B3-CCW-B
            role: candidate-opener
            opening: B3:CCW
            opener: B
            opener_c: 2.5
            opener_t: 0.8
            opener_label: candidate
            responder_c: 1.5
            responder_t: 0.6
            responder_label: baseline
          - id: candidate-responder-B3-CW-A
            role: candidate-responder
            opening: B3:CW
            opener: A
            opener_c: 1.5
            opener_t: 0.6
            opener_label: baseline
            responder_c: 2.5
            responder_t: 0.8
            responder_label: candidate
          - id: candidate-responder-B3-CW-B
            role: candidate-responder
            opening: B3:CW
            opener: B
            opener_c: 1.5
            opener_t: 0.6
            opener_label: baseline
            responder_c: 2.5
            responder_t: 0.8
            responder_label: candidate
          - id: candidate-responder-B3-CCW-A
            role: candidate-responder
            opening: B3:CCW
            opener: A
            opener_c: 1.5
            opener_t: 0.6
            opener_label: baseline
            responder_c: 2.5
            responder_t: 0.8
            responder_label: candidate
          - id: candidate-responder-B3-CCW-B
            role: candidate-responder
            opening: B3:CCW
            opener: B
            opener_c: 1.5
            opener_t: 0.6
            opener_label: baseline
            responder_c: 2.5
            responder_t: 0.8
            responder_label: candidate
          - id: candidate-self-B3-CW-A
            role: candidate-self
            opening: B3:CW
            opener: A
            opener_c: 2.5
            opener_t: 0.8
            opener_label: candidate
            responder_c: 2.5
            responder_t: 0.8
            responder_label: candidate
          - id: candidate-self-B3-CW-B
            role: candidate-self
            opening: B3:CW
            opener: B
            opener_c: 2.5
            opener_t: 0.8
            opener_label: candidate
            responder_c: 2.5
            responder_t: 0.8
            responder_label: candidate
          - id: candidate-self-B3-CCW-A
            role: candidate-self
            opening: B3:CCW
            opener: A
            opener_c: 2.5
            opener_t: 0.8
            opener_label: candidate
            responder_c: 2.5
            responder_t: 0.8
            responder_label: candidate
          - id: candidate-self-B3-CCW-B
            role: candidate-self
            opening: B3:CCW
            opener: B
            opener_c: 2.5
            opener_t: 0.8
            opener_label: candidate
            responder_c: 2.5
            responder_t: 0.8
            responder_label: candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run asymmetric crossplay
        run: |
          npx tsx src/benchmarks/b3-puct-crossplay.ts \
            --opening "${{ matrix.opening }}" \
            --opener-agent "${{ matrix.opener }}" \
            --opener-c-puct "${{ matrix.opener_c }}" \
            --opener-temperature "${{ matrix.opener_t }}" \
            --opener-label "${{ matrix.opener_label }}" \
            --responder-c-puct "${{ matrix.responder_c }}" \
            --responder-temperature "${{ matrix.responder_t }}" \
            --responder-label "${{ matrix.responder_label }}" \
            --fixed-simulations 20000 \
            --max-board-moves 200 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: b3cross-${{ matrix.id }}
          path: result.json
          retention-days: 7

  summarize:
    needs: play
    if: always() && needs.play.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: b3cross-*
          path: results
      - name: Summarize crossplay
        run: |
          python - <<'PY'
          import glob,json,collections
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          groups=collections.defaultdict(list)
          for r in rows:
              key=(r["config"]["opener"]["label"],r["config"]["responder"]["label"])
              groups[key].append(r)
          md=["# B3 PUCT crossplay","",
              "QG3F, 20k fixed simulations/decision, B3 CW/CCW x opener identity A/B.","",
              "| opener search | responder search | games | OW | D | RW | avg opener margin |",
              "|---|---|---:|---:|---:|---:|---:|"]
          summary={}
          for key,arr in sorted(groups.items()):
              counts={"OW":0,"D":0,"RW":0,"U":0}; margins=[]
              for r in arr:
                  o=r["outcome"]
                  if o["unresolved"]: lab="U"
                  elif o["openerValue"]==1: lab="OW"
                  elif o["openerValue"]==0: lab="D"
                  else: lab="RW"
                  counts[lab]+=1
                  if o["openerMargin"] is not None:margins.append(o["openerMargin"])
              avg=sum(margins)/len(margins) if margins else None
              md.append(f'| {key[0]} | {key[1]} | {len(arr)} | {counts["OW"]} | {counts["D"]} | {counts["RW"]} | {avg:.1f} |')
              summary["/".join(key)]={"counts":counts,"averageOpenerMargin":avg,"games":arr}
          with open("b3-puct-crossplay-summary.md","w",encoding="utf-8") as f:f.write("\n".join(md)+"\n")
          with open("b3-puct-crossplay-summary.json","w",encoding="utf-8") as f:json.dump(summary,f,indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-puct-crossplay-summary
          path: |
            b3-puct-crossplay-summary.md
            b3-puct-crossplay-summary.json
          retention-days: 7
