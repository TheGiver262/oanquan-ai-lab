name: temporary-v3a1-revalidation-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v3a1-revalidation-cleanup.yml"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Delete temporary revalidation branch
        run: git push origin --delete research/v3a1-dual-mode-revalidation

      - name: Prune completed historical runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 30); do
            PENDING="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.id != ($CURRENT_RUN|tonumber) and .status != \"completed\") | .id")"
            [ -z "$PENDING" ] && break
            sleep 2
          done

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.status] | @tsv' |
          while IFS=$'\t' read -r id status; do
            if [ "$id" = "$CURRENT_RUN" ]; then
              continue
            fi
            if [ "$status" = "completed" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
            fi
          done

      - name: Remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v3a1-revalidation-cleanup.yml
          git commit -m "chore: remove V3A.1 revalidation cleanup workflow"
          git push origin HEAD:main
