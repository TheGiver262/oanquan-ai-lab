name: v3a1-candidate-025-targeted

on:
  push:
    branches:
      - research/puct-v3a1-leaf-score
    paths:
      - ".github/workflows/v3a1-candidate-025-targeted.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  move2-quality:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Compare B1 against known winning B4 with fresh incumbent continuation
        run: |
          npx tsx src/benchmarks/b3-move2-fair-branch-comparison.ts \
            --opening B3:CW \
            --opener-agent A \
            --target-board-move 2 \
            --action-a B1:CW \
            --action-b B4:CW \
            --fixed-simulations 99066 \
            --max-board-moves 240 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-025-move2-quality
          path: result.json
          retention-days: 7

  deep34:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate 0.25 at deep move 34
        run: |
          npx tsx src/benchmarks/v3a1-leaf-score-root-ablation.ts \
            --case move34 \
            --fixed-simulations 90000 \
            --leaf-score-weight 0.25 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-025-deep34
          path: result.json
          retention-days: 7
