name: qg3f-double-deviation-100k

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - "src/benchmarks/double-forced-deviation-selfplay.ts"
      - ".github/workflows/qg3f-double-deviation-100k.yml"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/research/balance-modes.ts"
      - "src/engine.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  validate:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: m6-b3-cw-A
            opening: B3:CW
            first_action: B1:CW
            second_move: 6
            second_action: B3:CW
            opener: A
          - id: m6-b3-ccw-A
            opening: B3:CCW
            first_action: B5:CCW
            second_move: 6
            second_action: B3:CCW
            opener: A
          - id: m6-b3-cw-B
            opening: B3:CW
            first_action: B1:CW
            second_move: 6
            second_action: B3:CW
            opener: B
          - id: m6-b3-ccw-B
            opening: B3:CCW
            first_action: B5:CCW
            second_move: 6
            second_action: B3:CCW
            opener: B
          - id: m8-b4ccw-cw-A
            opening: B3:CW
            first_action: B1:CW
            second_move: 8
            second_action: B4:CCW
            opener: A
          - id: m8-b4ccw-ccw-A
            opening: B3:CCW
            first_action: B5:CCW
            second_move: 8
            second_action: B2:CW
            opener: A
          - id: m8-b4ccw-cw-B
            opening: B3:CW
            first_action: B1:CW
            second_move: 8
            second_action: B4:CCW
            opener: B
          - id: m8-b4ccw-ccw-B
            opening: B3:CCW
            first_action: B5:CCW
            second_move: 8
            second_action: B2:CW
            opener: B
          - id: m8-b4cw-cw-A
            opening: B3:CW
            first_action: B1:CW
            second_move: 8
            second_action: B4:CW
            opener: A
          - id: m8-b4cw-ccw-A
            opening: B3:CCW
            first_action: B5:CCW
            second_move: 8
            second_action: B2:CCW
            opener: A
          - id: m8-b4cw-cw-B
            opening: B3:CW
            first_action: B1:CW
            second_move: 8
            second_action: B4:CW
            opener: B
          - id: m8-b4cw-ccw-B
            opening: B3:CCW
            first_action: B5:CCW
            second_move: 8
            second_action: B2:CCW
            opener: B
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate two-deviation chain at 100k
        run: |
          npx tsx src/benchmarks/double-forced-deviation-selfplay.ts \
            --mode quan-gia-threefold \
            --opening "${{ matrix.opening }}" \
            --first-force-move 2 \
            --first-force-action "${{ matrix.first_action }}" \
            --second-force-move "${{ matrix.second_move }}" \
            --second-force-action "${{ matrix.second_action }}" \
            --opener-agent "${{ matrix.opener }}" \
            --fixed-simulations 100000 \
            --max-board-moves 240 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: double100k-${{ matrix.id }}
          path: result.json
          retention-days: 7

  summarize:
    needs: validate
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: double100k-*
          path: results
      - name: Build summary
        run: |
          python - <<'PY'
          import glob,json
          docs=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: docs.append(json.load(f))
          docs.sort(key=lambda d:(d["forces"][1]["boardMove"], d["forces"][1]["requestedAction"], d["opening"], d["openerAgent"]))
          md=["# QG3F two-deviation 100k validation","",
              "| second force | opening | opener id | second rank | outcome | margin | moves |",
              "|---|---|---|---:|---|---:|---:|"]
          for d in docs:
              s=d["forces"][1]
              o=d["outcome"]
              md.append(f'| m{s["boardMove"]} {s["requestedAction"]} | {d["opening"]} | {d["openerAgent"]} | {s["forcedRank"]} | {o["openerValue"]} | {o["openerMargin"]} | {o["boardMoves"]} |')
          groups={}
          for d in docs:
              s=d["forces"][1]
              key=(s["boardMove"], s["requestedAction"] if d["opening"]=="B3:CW" else "mirror")
              groups.setdefault(key,[]).append(d)
          md += ["","## Integrity",""]
          for key,arr in groups.items():
              md.append(f'- {key}: {len(arr)} cases')
          with open("qg3f-double-deviation-100k-summary.md","w",encoding="utf-8") as f:f.write("\n".join(md)+"\n")
          with open("qg3f-double-deviation-100k-summary.json","w",encoding="utf-8") as f:json.dump(docs,f,indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qg3f-double-deviation-100k-summary
          path: |
            qg3f-double-deviation-100k-summary.md
            qg3f-double-deviation-100k-summary.json
          retention-days: 7
