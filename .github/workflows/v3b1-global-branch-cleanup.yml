name: temporary-v3b1-global-branch-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v3b1-global-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete promoted research branch
        run: git push origin --delete research/v3b2-global-safe-pnsum
