name: focused-qg3f-100k-memory-validation

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/focused-qg3f-100k-memory-validation.yml"
      - "src/benchmarks/forced-deviation-selfplay.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/research/balance-modes.ts"
      - "src/engine.ts"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cw-A
            opening: B3:CW
            force_action: B1:CW
            opener: A
          - id: cw-B
            opening: B3:CW
            force_action: B1:CW
            opener: B
          - id: ccw-A
            opening: B3:CCW
            force_action: B5:CCW
            opener: A
          - id: ccw-B
            opening: B3:CCW
            force_action: B5:CCW
            opener: B
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate 100k forced resource with larger Node heap
        run: |
          npx tsx src/benchmarks/forced-deviation-selfplay.ts \
            --mode quan-gia-threefold \
            --opening "${{ matrix.opening }}" \
            --force-board-move 2 \
            --force-action "${{ matrix.force_action }}" \
            --opener-agent "${{ matrix.opener }}" \
            --fixed-simulations 100000 \
            --max-board-moves 240 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: focused100k-${{ matrix.id }}
          path: result.json
          retention-days: 7
