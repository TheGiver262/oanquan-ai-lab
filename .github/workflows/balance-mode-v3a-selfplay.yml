name: balance-mode-v3a-selfplay

on:
  workflow_dispatch:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/balance-mode-v3a-selfplay.yml"
      - "src/benchmarks/balance-mode-v3a-selfplay.ts"
      - "src/research/balance-modes.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/research/puct-v3a.ts"
      - "src/engine.ts"
      - "src/types.ts"
      - "tests/balance-modes.test.ts"
      - "tests/mode-aware-puct-v3a.test.ts"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        mode:
          - standard
          - pie-threefold
          - delayed-pie-4-threefold
          - delayed-pie-6-threefold
          - open-pie-threefold
          - quan-gia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Smoke mode-aware self-play
        run: >-
          npx tsx src/benchmarks/balance-mode-v3a-selfplay.ts
          --mode ${{ matrix.mode }}
          --opening auto
          --time-budget-ms 30
          --simulation-cap 2000
          --max-board-moves 20

  play:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        mode:
          - standard
          - pie-threefold
          - delayed-pie-4-threefold
          - delayed-pie-6-threefold
          - open-pie-threefold
          - quan-gia
        opening:
          - auto
          - "B1:CW"
          - "B1:CCW"
          - "B2:CW"
          - "B2:CCW"
          - "B3:CW"
          - "B3:CCW"
          - "B4:CW"
          - "B4:CCW"
          - "B5:CW"
          - "B5:CCW"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build artifact slug
        id: slug
        shell: bash
        run: |
          opening='${{ matrix.opening }}'
          echo "value=${opening//:/-}" >> "$GITHUB_OUTPUT"
      - name: Run strongest V3A self-play
        run: >-
          npx tsx src/benchmarks/balance-mode-v3a-selfplay.ts
          --mode ${{ matrix.mode }}
          --opening '${{ matrix.opening }}'
          --time-budget-ms 1200
          --simulation-cap 5000000
          --max-board-moves 160
          --out balance-${{ matrix.mode }}-${{ steps.slug.outputs.value }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: balance-${{ matrix.mode }}-${{ steps.slug.outputs.value }}
          path: balance-${{ matrix.mode }}-${{ steps.slug.outputs.value }}.json
          retention-days: 3

  summarize:
    needs: play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: balance-*
          path: balance-results
          merge-multiple: true
      - name: Build Standard-relative summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import statistics
          from pathlib import Path

          rows = [json.loads(p.read_text()) for p in sorted(Path('balance-results').glob('balance-*.json'))]
          modes = [
              'standard',
              'pie-threefold',
              'delayed-pie-4-threefold',
              'delayed-pie-6-threefold',
              'open-pie-threefold',
              'quan-gia',
          ]

          def pct(values, q):
              if not values:
                  return None
              values = sorted(values)
              return values[min(len(values)-1, max(0, math.ceil(q*len(values))-1))]

          summaries = {}
          for mode in modes:
              group = [r for r in rows if r['mode'] == mode]
              forced = [r for r in group if r['methodology']['openingRequest'] != 'auto']
              auto = next((r for r in group if r['methodology']['openingRequest'] == 'auto'), None)
              resolved = [r for r in forced if not r['outcome']['unresolved']]
              values = [r['outcome']['openerAgentValue'] for r in resolved]
              lengths = [r['outcome']['boardMoves'] for r in forced]
              margins = [r['outcome']['finalScoreMarginA'] for r in resolved]
              swap_rows = [r for r in forced if r['swap']['used']]
              summaries[mode] = {
                  'forcedGames': len(forced),
                  'AWin': sum(r['outcome']['winnerAgent'] == 'A' for r in resolved),
                  'BWin': sum(r['outcome']['winnerAgent'] == 'B' for r in resolved),
                  'draw': sum(r['outcome']['winnerAgent'] is None for r in resolved),
                  'unresolved': sum(r['outcome']['unresolved'] for r in forced),
                  'meanOpenerValue': statistics.fmean(values) if values else None,
                  'medianOpenerValue': statistics.median(values) if values else None,
                  'bestOpenerValue': max(values) if values else None,
                  'meanScoreMarginA': statistics.fmean(margins) if margins else None,
                  'medianMoves': statistics.median(lengths) if lengths else None,
                  'p95Moves': pct(lengths, .95),
                  'threefoldEnds': sum(r['outcome']['finishReason'] == 'repeated_moves' for r in forced),
                  'swapUses': len(swap_rows),
                  'medianSwapAtBoardMove': statistics.median([r['swap']['atBoardMove'] for r in swap_rows]) if swap_rows else None,
                  'auto': None if auto is None else {
                      'opening': auto['methodology']['openingPlayed'],
                      'value': auto['outcome']['openerAgentValue'],
                      'winner': auto['outcome']['winnerAgent'],
                      'unresolved': auto['outcome']['unresolved'],
                      'swapUsed': auto['swap']['used'],
                      'swapAtBoardMove': auto['swap']['atBoardMove'],
                      'finishReason': auto['outcome']['finishReason'],
                      'moves': auto['outcome']['boardMoves'],
                  },
              }

          base = summaries['standard']['meanOpenerValue']
          lines = [
              '# PUCT V3A Balance Mode Self-play — Standard-relative summary',
              '',
              'All forced-opening rows enumerate the opening landscape for diagnosis; no product mode forces an opening.',
              'The `auto` row is the actual root choice made by mode-aware PUCT V3A.',
              '',
              '| Mode | A-B-D-U | Mean opener value | Δ vs Standard | Mean score margin A | 3-fold ends | Swaps | Median/P95 moves | Auto opening / outcome |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---|',
          ]
          for mode in modes:
              s = summaries[mode]
              mean = s['meanOpenerValue']
              delta = None if mean is None or base is None else mean - base
              auto = s['auto'] or {}
              auto_text = f"{auto.get('opening','?')} / {auto.get('value','?')}" + (' / SWAP' if auto.get('swapUsed') else '')
              lines.append(
                  f"| {mode} | {s['AWin']}-{s['BWin']}-{s['draw']}-{s['unresolved']} | "
                  f"{mean if mean is not None else 'n/a'} | {delta if delta is not None else 'n/a'} | "
                  f"{s['meanScoreMarginA'] if s['meanScoreMarginA'] is not None else 'n/a'} | "
                  f"{s['threefoldEnds']} | {s['swapUses']} | {s['medianMoves']}/{s['p95Moves']} | {auto_text} |"
              )

          Path('balance-mode-summary.json').write_text(json.dumps({'summaries': summaries, 'raw': rows}, indent=2) + '\n')
          Path('balance-mode-summary.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: balance-mode-v3a-summary
          path: |
            balance-mode-summary.json
            balance-mode-summary.md
          retention-days: 7
