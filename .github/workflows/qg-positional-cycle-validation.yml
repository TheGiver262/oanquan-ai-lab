name: qg-positional-cycle-validation

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/qg-positional-cycle-validation.yml"
      - "tests/positional-threefold-cycle.test.ts"
      - "src/research/balance-modes.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/types.ts"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Replay known B3 cycle deterministically
        run: npx vitest run tests/positional-threefold-cycle.test.ts
      - run: npm run build
