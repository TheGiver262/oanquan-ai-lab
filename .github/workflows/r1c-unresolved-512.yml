name: r1c-unresolved-512

on:
  push:
    branches:
      - research/r1c-ai-promotion
    paths:
      - ".github/workflows/r1c-unresolved-512.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/puct-v2.test.ts tests/puct-v3a.test.ts tests/v3-live-quan-corpus.test.ts tests/server-production-parity.test.ts
      - run: npm run build

  replay:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v2-null-512
            candidate: puct-v2
            baseline: puct-v2
            positions: B3:CW>T4:CCW,B3:CCW>T2:CW,B3:CCW>T5:CCW
          - id: v3a-vs-v2-512
            candidate: puct-v3a
            baseline: puct-v2
            positions: B3:CCW>T5:CCW
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Replay only Stage 1 censored positions
        run: >-
          npx tsx src/benchmarks/r1c-puct-replay.ts
          --candidate ${{ matrix.candidate }}
          --baseline ${{ matrix.baseline }}
          --positions '${{ matrix.positions }}'
          --simulations 4000
          --max-moves 512
          --out r1c-${{ matrix.id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1c-${{ matrix.id }}
          path: r1c-${{ matrix.id }}.json
