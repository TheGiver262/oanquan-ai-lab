name: b3-root-transition-audit

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/b3-root-transition-audit.yml"
      - "src/benchmarks/b3-root-transition-audit.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/research/balance-modes.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: b60000
            budget: 60000
          - id: b70000
            budget: 70000
          - id: b80000
            budget: 80000
          - id: b90000
            budget: 90000
          - id: b100000
            budget: 100000
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit B3 root transition
        run: |
          npx tsx src/benchmarks/b3-root-transition-audit.ts \
            --opening B3:CW \
            --opener-agent A \
            --target-board-move 4 \
            --fixed-simulations "${{ matrix.budget }}" \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: transition-${{ matrix.id }}
          path: result.json
          retention-days: 7

  summarize:
    needs: audit
    if: always() && needs.audit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: transition-*
          path: results
      - name: Summarize transition
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:r["methodology"]["fixedSimulations"])
          md=["# B3 root transition audit","",
              "Canonical representative only: B3:CW, opener A. Same fixed budget is used for every prefix decision and the fresh target root. No continuation game is played.","",
              "| budget | prefix | state fingerprint | selected | B1:CW rank/visits/mean | B3:CW rank/visits/mean | B3:CCW rank/visits/mean |",
              "|---:|---|---|---|---|---|---|"]
          for r in rows:
              stats={x["action"]:x for x in r["target"]["rootStats"]}
              def fmt(k):
                  x=stats.get(k)
                  return "-" if not x else f'{x["rank"]}/{x["visits"]}/{x["meanValue"]:.4f}'
              pref=" → ".join(x["action"] for x in r["prefix"])
              md.append(f'| {r["methodology"]["fixedSimulations"]} | {pref} | {r["target"]["exactStateFingerprint"]} | {r["target"]["selectedAction"]} | {fmt("B1:CW")} | {fmt("B3:CW")} | {fmt("B3:CCW")} |')
          fingerprints={}
          for r in rows:
              fingerprints.setdefault(r["target"]["exactStateFingerprint"],[]).append(r["methodology"]["fixedSimulations"])
          report={"rows":rows,"fingerprintGroups":fingerprints}
          open("b3-root-transition-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(report,open("b3-root-transition-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-root-transition-summary
          path: |
            b3-root-transition-summary.md
            b3-root-transition-summary.json
          retention-days: 7
