name: v3a1-material36-vs-trang-nguyen

on:
  push:
    branches:
      - research/puct-v3a1-leaf-score
    paths:
      - ".github/workflows/v3a1-material36-vs-trang-nguyen.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/engine.test.ts tests/server-production-parity.test.ts tests/puct-v3a.test.ts tests/v3-live-quan-corpus.test.ts tests/v3-balanced-midgame-corpus.test.ts
      - run: npm run build

  gate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        stage: [stage1, stage2, stage3]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Stamp exact production-semantics evidence metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/benchmarks/r1d-production-semantics-v3a-vs-trang-nguyen.ts')
          s = p.read_text()
          s = s.replace('experiment: "R1c-v3a-vs-production-trang-nguyen"', 'experiment: "V3A1-material36-vs-code-parity-trang-nguyen"')
          s = s.replace('repetition: "documented repeated_moves rule enabled; recent move history is rule-relevant state"', 'repetition: "audited production legacy semantics: repeated_moves termination disabled; recentMoves does not terminate games"')
          p.write_text(s)
          PY
      - name: Run V3A.1 material36 vs code-parity Trang Nguyen
        run: >-
          npx tsx src/benchmarks/r1d-production-semantics-v3a-vs-trang-nguyen.ts
          --stage ${{ matrix.stage }}
          --candidate v3a
          --time-budget-ms 1200
          --production-nodes 100000
          --simulation-cap 5000000
          --candidate-leaf-score-material-max 36
          --replicate 1
          --out v3a1-tn-${{ matrix.stage }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-tn-${{ matrix.stage }}
          path: v3a1-tn-${{ matrix.stage }}.json
          retention-days: 7

  summarize:
    needs: gate
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v3a1-tn-*
          path: results
      - name: Build TN gate summary
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/v3a1-tn-*.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:r["methodology"]["stage"])
          md=["# V3A.1 material36 vs code-parity Trang Nguyen","",
              "Production-envelope runtime comparison; candidate uses material-gated leaf score max=36. No live learning snapshot is loaded.","",
              "| stage | games | V3A.1 W | TN W | draws | unresolved | resolved score | pairs +/=/- | mean pair diff |",
              "|---|---:|---:|---:|---:|---:|---:|---|---:|"]
          total={"cw":0,"bw":0,"d":0,"u":0,"pairs":[]}
          for r in rows:
              md.append(f'| {r["methodology"]["stage"]} | {r["games"]} | {r["candidateWins"]} | {r["baselineWins"]} | {r["draws"]} | {r["unresolved"]} | {r["resolvedScoreRate"] if r["resolvedScoreRate"] is not None else "-"} | {r["favorablePairs"]}/{r["neutralPairs"]}/{r["unfavorablePairs"]} | {r["meanPairDiff"] if r["meanPairDiff"] is not None else "-"} |')
              total["cw"]+=r["candidateWins"]; total["bw"]+=r["baselineWins"]; total["d"]+=r["draws"]; total["u"]+=r["unresolved"]; total["pairs"]+=r["pairDiffs"]
          p=total["pairs"]
          md += ["",f'- Aggregate resolved W-D-L (V3A.1 perspective): **{total["cw"]}-{total["d"]}-{total["bw"]}**',
                 f'- Aggregate unresolved: **{total["u"]}**',
                 f'- Aggregate completed-pair mean diff: **{sum(p)/len(p) if p else "n/a"}**',
                 "- Scope: code-parity Trang Nguyen only; this is not live-equivalent learning-snapshot evidence."]
          open("v3a1-material36-vs-tn-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(rows,open("v3a1-material36-vs-tn-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-material36-vs-tn-summary
          path: |
            v3a1-material36-vs-tn-summary.md
            v3a1-material36-vs-tn-summary.json
          retention-days: 7
