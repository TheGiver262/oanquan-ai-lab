name: b3-root-leaf-provenance-audit

on:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/b3-root-leaf-provenance-audit.yml"
      - "src/benchmarks/b3-root-leaf-provenance-audit.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "tests/mode-aware-puct-v3a.test.ts"
      - "src/research/balance-modes.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: b68000
            budget: 68000
          - id: b80000
            budget: 80000
          - id: b90000
            budget: 90000
          - id: b99066
            budget: 99066
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit root leaf reward provenance
        run: |
          npx tsx src/benchmarks/b3-root-leaf-provenance-audit.ts \
            --opening B3:CW \
            --opener-agent A \
            --target-board-move 2 \
            --fixed-simulations "${{ matrix.budget }}" \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: leafprov-${{ matrix.id }}
          path: result.json
          retention-days: 7

  summarize:
    needs: audit
    if: always() && needs.audit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: leafprov-*
          path: results
      - name: Build provenance summary
        run: |
          python - <<'PY'
          import glob,json
          docs=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: docs.append(json.load(f))
          docs.sort(key=lambda d:d["methodology"]["fixedSimulations"])
          md=["# B3 root leaf reward provenance","",
              "Observation-only audit of the fresh move-2 root for canonical B3:CW / opener A. Search math is unchanged.",
              "",
              "| budget | selected | action | rank | visits | mean | cycle % / contrib | heuristic % / contrib | terminal % / W-D-L / contrib | solved-nonterminal % / contrib | mean depth |",
              "|---:|---|---|---:|---:|---:|---|---|---|---|---:|"]
          report=[]
          for d in docs:
              for action in ("B4:CW","B5:CCW"):
                  r=next(x for x in d["rows"] if x["action"]==action)
                  md.append(
                    f'| {d["methodology"]["fixedSimulations"]} | {d["selectedAction"]} | {action} | {r["rank"]} | {r["visits"]} | {r["meanValue"]:.6f} | '
                    f'{100*r["cycle"]["fraction"]:.2f}% / {r["cycle"]["contributionToOverallMean"]:.4f} | '
                    f'{100*r["heuristic"]["fraction"]:.2f}% / {r["heuristic"]["contributionToOverallMean"]:.4f} | '
                    f'{100*r["terminal"]["fraction"]:.2f}% / {r["terminal"]["wins"]}-{r["terminal"]["draws"]}-{r["terminal"]["losses"]} / {r["terminal"]["contributionToOverallMean"]:.4f} | '
                    f'{100*r["solvedNonterminal"]["fraction"]:.2f}% / {r["solvedNonterminal"]["contributionToOverallMean"]:.4f} | '
                    f'{r["total"]["meanDepth"] if "total" in r else r["auditMeanReward"]} |'
                  )
              report.append(d)
          open("b3-root-leaf-provenance-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(report,open("b3-root-leaf-provenance-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b3-root-leaf-provenance-summary
          path: |
            b3-root-leaf-provenance-summary.md
            b3-root-leaf-provenance-summary.json
          retention-days: 7
