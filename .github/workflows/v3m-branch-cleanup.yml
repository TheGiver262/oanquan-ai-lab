name: temporary-v3m-branch-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v3m-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete closed V3M branch
        run: git push origin --delete research/v3m-root-q-conflict-guard
      - name: Remove cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v3m-branch-cleanup.yml
          git commit -m "chore: remove V3M branch cleanup workflow"
          git push origin HEAD:main
