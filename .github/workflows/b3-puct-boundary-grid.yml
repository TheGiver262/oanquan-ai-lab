name: b3-puct-boundary-grid

on:
  workflow_dispatch:
  push:
    branches:
      - research/balanced-mode-tournament
    paths:
      - ".github/workflows/b3-puct-boundary-grid.yml"

jobs:
  grid:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: c3p8-t1p05
            c_puct: 3.8
            temperature: 1.05
          - id: c3p8-t1p10
            c_puct: 3.8
            temperature: 1.10
          - id: c3p8-t1p15
            c_puct: 3.8
            temperature: 1.15
          - id: c3p8-t1p20
            c_puct: 3.8
            temperature: 1.20
          - id: c3p9-t1p05
            c_puct: 3.9
            temperature: 1.05
          - id: c3p9-t1p10
            c_puct: 3.9
            temperature: 1.10
          - id: c3p9-t1p15
            c_puct: 3.9
            temperature: 1.15
          - id: c3p9-t1p20
            c_puct: 3.9
            temperature: 1.20
          - id: c4p0-t1p05
            c_puct: 4.0
            temperature: 1.05
          - id: c4p0-t1p10
            c_puct: 4.0
            temperature: 1.10
          - id: c4p0-t1p15
            c_puct: 4.0
            temperature: 1.15
          - id: c4p0-t1p20
            c_puct: 4.0
            temperature: 1.20
          - id: c4p1-t1p05
            c_puct: 4.1
            temperature: 1.05
          - id: c4p1-t1p10
            c_puct: 4.1
            temperature: 1.10
          - id: c4p1-t1p15
            c_puct: 4.1
            temperature: 1.15
          - id: c4p1-t1p20
            c_puct: 4.1
            temperature: 1.20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Scan B3 boundary
        run: |
          npx tsx src/benchmarks/balance-mode-v3a-selfplay.ts \
            --mode quan-gia-threefold \
            --opening B3:CW \
            --opener-agent A \
            --case-id "boundary-${{ matrix.id }}" \
            --fixed-simulations 20000 \
            --puct-exploration "${{ matrix.c_puct }}" \
            --policy-temperature "${{ matrix.temperature }}" \
            --max-board-moves 200 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-${{ matrix.id }}
          path: result.json
          retention-days: 7
