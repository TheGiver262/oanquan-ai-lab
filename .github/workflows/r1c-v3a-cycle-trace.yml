name: r1c-v3a-cycle-trace

on:
  push:
    branches:
      - research/r1c-ai-promotion
    paths:
      - ".github/workflows/r1c-v3a-cycle-trace.yml"
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/puct-v2.test.ts tests/puct-v3a.test.ts tests/v3-live-quan-corpus.test.ts tests/server-production-parity.test.ts
      - run: npm run build
      - name: Trace real-game recurrence
        run: >-
          npx tsx src/benchmarks/r1c-v3a-cycle-trace.ts
          --simulations 4000
          --max-continuation-moves 512
          --stop-after-repeat-occurrences 6
          --out r1c-v3a-cycle-trace.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1c-v3a-cycle-trace
          path: r1c-v3a-cycle-trace.json
