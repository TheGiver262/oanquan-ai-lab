name: puct-v3c-transform

on:
  push:
    branches:
      - research/pnsum-puct-v3c

permissions:
  contents: write

jobs:
  transform:
    if: "github.event.head_commit.message == 'fix: scope V3C PNSum transform to selectChild'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pnsum-puct-v3c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Convert PNMax core to PNSum V3C
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/research/puct-v3c.ts')
          s = path.read_text()

          required = [
              'PuctV3BOptions', 'PuctV3BDiagnostics', 'PuctV3BMoveStat',
              'PuctV3BDecision', 'GpnPuctV3B', 'computePnMaxBonuses',
              'pnMaxBonusValues', 'pnMaxBonus', 'PNMax',
          ]
          missing = [token for token in required if token not in s]
          if missing:
              raise SystemExit(f'seeded V3B tokens missing: {missing}')

          replacements = [
              ('PuctV3BOptions', 'PuctV3COptions'),
              ('PuctV3BDiagnostics', 'PuctV3CDiagnostics'),
              ('PuctV3BMoveStat', 'PuctV3CMoveStat'),
              ('PuctV3BDecision', 'PuctV3CDecision'),
              ('GpnPuctV3B', 'PnSumPuctV3C'),
              ('PUCT V3B', 'PUCT V3C'),
              ('V3B keeps V3A', 'V3C keeps V3A'),
              ('PNMax', 'PNSum'),
              ('pnMaxBonus', 'pnSumBonus'),
              ('computePnMaxBonuses', 'computePnSumBonuses'),
              ('pnMaxBonusValues', 'pnSumBonusValues'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)

          import_anchor = 'import type { GameState, PlayerId, PlayerMove } from "../types.js";\n'
          if import_anchor not in s:
              raise SystemExit('import anchor missing')
          s = s.replace(
              import_anchor,
              import_anchor + 'import { computePnSumBonuses } from "./pnsum.js";\n',
              1,
          )

          start = s.index('  private selectChild(')
          end = s.index('  private updateSolvedOutcome', start)
          section = s[start:end]

          changes = [
              (
                  '    let finiteCount = 0;\n    let minFinite = Number.POSITIVE_INFINITY;',
                  '    let finiteCount = 0;\n    let finiteSum = 0;\n    let minFinite = Number.POSITIVE_INFINITY;',
              ),
              (
                  '        finiteCount += 1;\n        if (proofNumber < minFinite) minFinite = proofNumber;',
                  '        finiteCount += 1;\n        finiteSum = Math.min(PROOF_NUMBER_CAP, finiteSum + proofNumber);\n        if (proofNumber < minFinite) minFinite = proofNumber;',
              ),
              (
                  '    const proofDenominator = finiteCount > 0 ? 1 + maxFinite - minFinite : 1;',
                  '    const proofDenominator = 1 + finiteSum;',
              ),
              (
                  '? 1 - (proofNumber - minFinite) / proofDenominator',
                  '? 1 - proofNumber / proofDenominator',
              ),
          ]
          for old, new in changes:
              if section.count(old) != 1:
                  raise SystemExit(f'selectChild transform expected exactly one match: {old!r}')
              section = section.replace(old, new, 1)
          s = s[:start] + section + s[end:]

          helper_start = s.index('/**\n * Published PNSum normalization')
          helper_end = s.index('\nfunction updateProofNumbers', helper_start)
          helper = '''/**
           * Published PNSum normalization. `null` represents infinity in the
           * exported/testable API. The implementation is shared with unit tests.
           */
          export { computePnSumBonuses };

          function pnSumBonusValues(proofNumbers: number[]): number[] {
            return computePnSumBonuses(
              proofNumbers.map((value) => Number.isFinite(value) ? value : null),
            );
          }
          '''
          # YAML block indentation is stripped uniformly; normalize the literal.
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())
          s = s[:helper_start] + helper + s[helper_end:]

          s = s.replace(
              'Experimental GPN-PUCT V3C research session.',
              'Experimental PNSum-PUCT V3C research session.',
          )
          s = s.replace(
              'adds a Generalized Proof-Number inspired\n * PNSum bias to PUCT selection:',
              'adds a Generalized Proof-Number PNSum bias to PUCT selection:',
          )
          s = s.replace(
              'This is an experimental adaptation of GPN-MCTS to PUCT, not the exact UCT\n * selection formula evaluated in the published GPN-MCTS paper.',
              'This is an experimental PNSum adaptation of GPN-MCTS to PUCT, not the exact UCT\n * selection formula evaluated in the published GPN-MCTS paper.',
          )

          forbidden = ['PuctV3B', 'GpnPuctV3B', 'PNMax', 'pnMaxBonus']
          remaining = [token for token in forbidden if token in s]
          if remaining:
              raise SystemExit(f'V3B/PNMax tokens remain after transform: {remaining}')
          path.write_text(s)
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/pnsum.test.ts tests/puct-v3a.test.ts
      - run: npm run build
      - name: Commit transformed core
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research/puct-v3c.ts
          git diff --cached --check
          git commit -m "research: implement PNSum PUCT V3C core"
          git push origin HEAD:research/pnsum-puct-v3c
