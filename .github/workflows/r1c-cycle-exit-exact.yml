name: r1c-cycle-exit-exact

on:
  push:
    branches:
      - research/r1c-ai-promotion
    paths:
      - ".github/workflows/r1c-cycle-exit-exact.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/exact-endgame-v4.test.ts tests/puct-v2.test.ts tests/puct-v3a.test.ts tests/v3-live-quan-corpus.test.ts tests/server-production-parity.test.ts
      - run: npm run build
      - name: Analyze exact exits from recurrent root
        run: >-
          npx tsx src/benchmarks/r1c-cycle-exit-exact.ts
          --simulations 4000
          --solver-node-budget 500000
          --solver-time-ms 5000
          --out r1c-cycle-exit-exact.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1c-cycle-exit-exact
          path: r1c-cycle-exit-exact.json
