name: r1c-puct-stage1

on:
  push:
    branches:
      - research/r1c-ai-promotion
    paths:
      - ".github/workflows/r1c-puct-stage1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/puct-v2.test.ts tests/puct-v3a.test.ts tests/server-production-parity.test.ts
      - run: npm run build

  ablation:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v2-null-control
            candidate: puct-v2
            baseline: puct-v2
          - id: v3a-vs-v2
            candidate: puct-v3a
            baseline: puct-v2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run deterministic fixed-simulation B3 reply corpus
        run: >-
          npm run benchmark:r1c:puct --
          --candidate ${{ matrix.candidate }}
          --baseline ${{ matrix.baseline }}
          --openings B3:CW,B3:CCW
          --reply-corpus
          --simulations 4000
          --max-moves 160
          --out r1c-${{ matrix.id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1c-${{ matrix.id }}
          path: r1c-${{ matrix.id }}.json
