name: v3a1-material36-tn-stage1-parallel

on:
  push:
    branches:
      - research/puct-v3a1-leaf-score
    paths:
      - ".github/workflows/v3a1-material36-tn-stage1-parallel.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/engine.test.ts tests/server-production-parity.test.ts tests/puct-v3a.test.ts
      - run: npm run build

  pair:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: p01, position: "B3:CW>T1:CW" }
          - { id: p02, position: "B3:CW>T1:CCW" }
          - { id: p03, position: "B3:CW>T2:CW" }
          - { id: p04, position: "B3:CW>T2:CCW" }
          - { id: p05, position: "B3:CW>T4:CW" }
          - { id: p06, position: "B3:CW>T4:CCW" }
          - { id: p07, position: "B3:CW>T5:CW" }
          - { id: p08, position: "B3:CW>T5:CCW" }
          - { id: p09, position: "B3:CCW>T1:CW" }
          - { id: p10, position: "B3:CCW>T1:CCW" }
          - { id: p11, position: "B3:CCW>T2:CW" }
          - { id: p12, position: "B3:CCW>T2:CCW" }
          - { id: p13, position: "B3:CCW>T4:CW" }
          - { id: p14, position: "B3:CCW>T4:CCW" }
          - { id: p15, position: "B3:CCW>T5:CW" }
          - { id: p16, position: "B3:CCW>T5:CCW" }
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Stamp exact production-semantics metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/benchmarks/r1d-production-semantics-v3a-vs-trang-nguyen.ts')
          s=p.read_text()
          s=s.replace('experiment: "R1c-v3a-vs-production-trang-nguyen"', 'experiment: "V3A1-material36-vs-code-parity-trang-nguyen-stage1-parallel"')
          s=s.replace('repetition: "documented repeated_moves rule enabled; recent move history is rule-relevant state"', 'repetition: "audited production legacy semantics: repeated_moves termination disabled; recentMoves does not terminate games"')
          p.write_text(s)
          PY
      - name: Run one Stage-1 seat-swapped pair
        run: >-
          npx tsx src/benchmarks/r1d-production-semantics-v3a-vs-trang-nguyen.ts
          --stage stage1
          --position-id "${{ matrix.position }}"
          --candidate v3a
          --time-budget-ms 1200
          --production-nodes 100000
          --simulation-cap 5000000
          --candidate-leaf-score-material-max 36
          --replicate 1
          --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-tn-stage1-${{ matrix.id }}
          path: result.json
          retention-days: 7

  summarize:
    needs: pair
    if: always() && needs.pair.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v3a1-tn-stage1-*
          path: results
      - name: Aggregate exact Stage-1 pairs
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:r["positions"][0])
          total={"w":0,"l":0,"d":0,"u":0}
          pairs=[]
          md=["# V3A.1 material36 vs TN — Stage 1 parallel exact gate","",
              "| position | W | L | D | U | pair diff |",
              "|---|---:|---:|---:|---:|---:|"]
          for r in rows:
              total["w"]+=r["candidateWins"]; total["l"]+=r["baselineWins"]; total["d"]+=r["draws"]; total["u"]+=r["unresolved"]
              pd=r["pairDiffs"][0] if r["pairDiffs"] else None
              if pd is not None:pairs.append(pd)
              md.append(f'| {r["positions"][0]} | {r["candidateWins"]} | {r["baselineWins"]} | {r["draws"]} | {r["unresolved"]} | {pd if pd is not None else "-"} |')
          fav=sum(x>0 for x in pairs); neu=sum(x==0 for x in pairs); unf=sum(x<0 for x in pairs)
          md += ["",f'- Aggregate W-D-L: **{total["w"]}-{total["d"]}-{total["l"]}**',
                 f'- Unresolved games: **{total["u"]}**',
                 f'- Completed pairs +/=/-: **{fav}/{neu}/{unf}**',
                 f'- Mean pair diff: **{sum(pairs)/len(pairs) if pairs else "n/a"}**']
          open("v3a1-tn-stage1-parallel-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(rows,open("v3a1-tn-stage1-parallel-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-tn-stage1-parallel-summary
          path: |
            v3a1-tn-stage1-parallel-summary.md
            v3a1-tn-stage1-parallel-summary.json
          retention-days: 7
