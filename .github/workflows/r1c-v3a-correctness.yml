name: r1c-v3a-correctness

on:
  push:
    branches:
      - research/r1c-ai-promotion
    paths:
      - ".github/workflows/r1c-v3a-correctness.yml"
      - "src/research/puct-v3a.ts"
      - "tests/puct-v3a.test.ts"
      - "src/engine.ts"
      - "src/reference/server-production-ai.ts"
      - "tests/server-production-parity.test.ts"
      - "docs/r1c-ai-promotion-protocol.md"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/puct-v3a.test.ts tests/server-production-parity.test.ts tests/exact-endgame-v4.test.ts tests/endgame-graph-v4.test.ts
      - run: npm test
      - run: npm run build
