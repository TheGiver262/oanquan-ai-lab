name: temporary-v3b1-retest-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v3b1-retest-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete completed retest branch
        run: git push origin --delete research/v3b1-three-mode-10k-retest
      - name: Remove cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v3b1-retest-cleanup.yml
          git commit -m "chore: remove V3B.1 retest cleanup workflow"
          git push origin HEAD:main
