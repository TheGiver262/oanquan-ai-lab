name: v4-vs-v3a1-10k-screen

on:
  push:
    branches:
      - research/puct-v4-quiescence
    paths:
      - ".github/workflows/v4-vs-v3a1-10k-screen.yml"
      - "src/research/puct-v3a.ts"
      - "src/research/puct-v3a1.ts"
      - "src/research/puct-v4.ts"
      - "src/benchmarks/v4-vs-v3a1-fixed.ts"
      - "tests/puct-v4.test.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  screen:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        stage: [stage1, stage2, stage3]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: V4 q10 vs V3A.1 material36
        run: |
          npx tsx src/benchmarks/v4-vs-v3a1-fixed.ts \
            --stage "${{ matrix.stage }}" \
            --fixed-simulations 10000 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4-v3a1-${{ matrix.stage }}-10k
          path: result.json
          retention-days: 7

  summarize:
    needs: screen
    if: always() && needs.screen.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v4-v3a1-*-10k
          path: results
      - name: Build V4 10k screen summary
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:r["methodology"]["stage"])
          md=["# V4 q10 vs V3A.1 — 10k broad screen","",
              "| stage | games | V4 W | V3A.1 W | draws | unresolved | pairs +/=/- | mean pair diff |",
              "|---|---:|---:|---:|---:|---:|---|---:|"]
          total={"cw":0,"iw":0,"d":0,"u":0,"pairs":[]}
          for r in rows:
              md.append(f'| {r["methodology"]["stage"]} | {r["games"]} | {r["candidateWins"]} | {r["incumbentWins"]} | {r["draws"]} | {r["unresolved"]} | {r["favorablePairs"]}/{r["neutralPairs"]}/{r["unfavorablePairs"]} | {r["meanPairDiff"] if r["meanPairDiff"] is not None else "-"} |')
              total["cw"]+=r["candidateWins"]; total["iw"]+=r["incumbentWins"]; total["d"]+=r["draws"]; total["u"]+=r["unresolved"]; total["pairs"]+=r["pairDiffs"]
          p=total["pairs"]
          md += ["",f'- Aggregate resolved W-D-L: **{total["cw"]}-{total["d"]}-{total["iw"]}**',
                 f'- Unresolved: **{total["u"]}**',
                 f'- Completed pairs +/=/-: **{sum(x>0 for x in p)}/{sum(x==0 for x in p)}/{sum(x<0 for x in p)}**',
                 f'- Mean pair diff: **{sum(p)/len(p) if p else "n/a"}**']
          open("v4-vs-v3a1-10k-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(rows,open("v4-vs-v3a1-10k-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v4-vs-v3a1-10k-summary
          path: |
            v4-vs-v3a1-10k-summary.md
            v4-vs-v3a1-10k-summary.json
          retention-days: 7
