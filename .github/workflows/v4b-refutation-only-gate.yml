name: v4b-refutation-only-gate

on:
  push:
    branches:
      - research/puct-v4-quiescence
    paths:
      - ".github/workflows/v4b-refutation-only-gate.yml"
      - "src/research/puct-v3a.ts"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/research/puct-v4b.ts"
      - "src/benchmarks/v3a1-leaf-score-root-ablation.ts"
      - "src/benchmarks/v4-vs-v3a1-fixed.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  causal:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: move2, case_id: move2, budget: 99066 }
          - { id: move34, case_id: move34, budget: 90000 }
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refutation-only causal guard
        run: |
          npx tsx src/benchmarks/v3a1-leaf-score-root-ablation.ts \
            --case "${{ matrix.case_id }}" \
            --fixed-simulations "${{ matrix.budget }}" \
            --leaf-score-weight 1.8 \
            --leaf-score-material-max 36 \
            --leaf-bootstrap unstable_refutation_only \
            --leaf-quiescence-score-swing 10 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4b-causal-${{ matrix.id }}
          path: result.json
          retention-days: 7

  screen:
    needs: causal
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        stage: [stage1, stage2, stage3]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: V4B vs V3A.1 10k
        run: |
          npx tsx src/benchmarks/v4-vs-v3a1-fixed.ts \
            --stage "${{ matrix.stage }}" \
            --candidate v4b \
            --fixed-simulations 10000 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4b-screen-${{ matrix.stage }}
          path: result.json
          retention-days: 7

  summarize:
    needs: screen
    if: always() && needs.screen.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v4b-screen-*
          path: results
      - name: Summarize V4B screen
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:r["methodology"]["stage"])
          md=["# V4B refutation-only 10k screen","",
              "| stage | W | D | L | U | pairs +/=/- | mean pair diff |",
              "|---|---:|---:|---:|---:|---|---:|"]
          cw=iw=d=u=0;pairs=[]
          for r in rows:
              md.append(f'| {r["methodology"]["stage"]} | {r["candidateWins"]} | {r["draws"]} | {r["incumbentWins"]} | {r["unresolved"]} | {r["favorablePairs"]}/{r["neutralPairs"]}/{r["unfavorablePairs"]} | {r["meanPairDiff"] if r["meanPairDiff"] is not None else "-"} |')
              cw+=r["candidateWins"]; iw+=r["incumbentWins"]; d+=r["draws"]; u+=r["unresolved"]; pairs+=r["pairDiffs"]
          md += ["",f'- Aggregate W-D-L: **{cw}-{d}-{iw}**',
                 f'- Unresolved: **{u}**',
                 f'- Completed pairs +/=/-: **{sum(x>0 for x in pairs)}/{sum(x==0 for x in pairs)}/{sum(x<0 for x in pairs)}**',
                 f'- Mean pair diff: **{sum(pairs)/len(pairs) if pairs else "n/a"}**']
          open("v4b-screen-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(rows,open("v4b-screen-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v4b-screen-summary
          path: |
            v4b-screen-summary.md
            v4b-screen-summary.json
          retention-days: 7
