name: v3a1-material36-promotion-screen

on:
  push:
    branches:
      - research/puct-v3a1-leaf-score
    paths:
      - ".github/workflows/v3a1-material36-promotion-screen.yml"
      - "src/research/puct-v3a.ts"
      - "tests/puct-v3a.test.ts"
      - "src/benchmarks/v3a1-vs-v3a-fixed.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  screen:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        stage: [stage1, stage2, stage3]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: V3A.1 material36 vs incumbent V3A
        run: |
          npx tsx src/benchmarks/v3a1-vs-v3a-fixed.ts \
            --stage "${{ matrix.stage }}" \
            --fixed-simulations 10000 \
            --candidate-leaf-score-weight 1.8 \
            --candidate-leaf-score-material-max 36 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-material36-${{ matrix.stage }}
          path: result.json
          retention-days: 7

  summarize:
    needs: screen
    if: always() && needs.screen.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v3a1-material36-*
          path: results
      - name: Build promotion summary
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:r["methodology"]["stage"])
          md=["# V3A.1 material36 promotion screen","",
              "Candidate keeps V3A score weight 1.8 but activates it only when remaining raw board material <= 36.",
              "Equal 10k fixed simulations per decision; every position is seat-swapped.","",
              "| stage | games | cand W | inc W | draws | unresolved | score | pairs +/=/- | mean pair diff |",
              "|---|---:|---:|---:|---:|---:|---:|---|---:|"]
          totals={"cw":0,"iw":0,"d":0,"u":0,"p":[]}
          for r in rows:
              md.append(f'| {r["methodology"]["stage"]} | {r["games"]} | {r["candidateWins"]} | {r["incumbentWins"]} | {r["draws"]} | {r["unresolved"]} | {r["resolvedScoreRate"] if r["resolvedScoreRate"] is not None else "-"} | {r["favorablePairs"]}/{r["neutralPairs"]}/{r["unfavorablePairs"]} | {r["meanPairDiff"] if r["meanPairDiff"] is not None else "-"} |')
              totals["cw"]+=r["candidateWins"]; totals["iw"]+=r["incumbentWins"]; totals["d"]+=r["draws"]; totals["u"]+=r["unresolved"]; totals["p"]+=r["pairDiffs"]
          p=totals["p"]
          md += ["",f'- Aggregate resolved W-D-L: **{totals["cw"]}-{totals["d"]}-{totals["iw"]}**',
                 f'- Aggregate unresolved: **{totals["u"]}**',
                 f'- Aggregate completed-pair mean diff: **{sum(p)/len(p) if p else "n/a"}**']
          open("v3a1-material36-promotion-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(rows,open("v3a1-material36-promotion-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-material36-promotion-summary
          path: |
            v3a1-material36-promotion-summary.md
            v3a1-material36-promotion-summary.json
          retention-days: 7
