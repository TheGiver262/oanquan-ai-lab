name: hybrid-exact-oracle-v6

on:
  push:
    branches:
      - research/hybrid-exact-oracle-v6
    paths:
      - "src/research/hybrid-exact-oracle-v6.ts"
      - "src/research/hybrid-wdl-oracle-v6.ts"
      - "src/research/wdl-graph-proof-v6.ts"
      - "src/research/wdl-tablebase-v6.ts"
      - "src/research/tablebase-pvs-v6.ts"
      - "src/research/endgame-graph-v4.ts"
      - "src/research/exact-policy-solver-v5.ts"
      - "src/research/repetition-policy-v5.ts"
      - "src/research/v3-pv-corpus.ts"
      - "src/benchmarks/hybrid-oracle-v6-coverage.ts"
      - "src/benchmarks/wdl-graph-v6-coverage.ts"
      - "src/benchmarks/hybrid-wdl-v6-ab.ts"
      - "src/benchmarks/tablebase-v6-holdout.ts"
      - "src/benchmarks/tablebase-v6-selfplay-generalization.ts"
      - "tests/hybrid-exact-oracle-v6.test.ts"
      - "tests/hybrid-wdl-oracle-v6.test.ts"
      - "tests/wdl-graph-proof-v6.test.ts"
      - "tests/tablebase-pvs-v6.test.ts"
      - "src/index.ts"
      - "package.json"
      - ".github/workflows/hybrid-exact-oracle-v6.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test -- --run tests/hybrid-exact-oracle-v6.test.ts tests/hybrid-wdl-oracle-v6.test.ts tests/wdl-graph-proof-v6.test.ts tests/tablebase-pvs-v6.test.ts tests/policy-aware-pvs-v5.test.ts tests/repetition-policy-v5.test.ts tests/exact-policy-solver-v5.test.ts tests/endgame-graph-v4.test.ts
      - run: npm run build

  tablebase-holdout:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        train_opening: [B3-CW, B3-CCW]
        placement: [leaf, all-low]
    name: tablebase-holdout (train=${{ matrix.train_opening }}, placement=${{ matrix.placement }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build offline WDL tablebase and test opposite opening
        shell: bash
        run: |
          mkdir -p results/v6-tablebase
          OPENING="${{ matrix.train_opening }}"
          OPENING="${OPENING/-/:}"
          npm run benchmark:v6:tablebase-holdout -- \
            --train-opening "$OPENING" \
            --max-board-value 12 \
            --graph-nodes 5000 \
            --graph-ms 100 \
            --search-nodes 30000 \
            --search-ms 300 \
            --max-depth 12 \
            --placement "${{ matrix.placement }}" \
            | tee "results/v6-tablebase/holdout-${{ matrix.train_opening }}-${{ matrix.placement }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v6-tablebase-${{ matrix.train_opening }}-${{ matrix.placement }}
          path: results/v6-tablebase/*.json

  tablebase-selfplay-generalization:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Train on seeded trajectories and test disjoint seeds
        shell: bash
        run: |
          mkdir -p results/v6-tablebase-selfplay
          npm run benchmark:v6:tablebase-selfplay -- \
            --train-games 4 \
            --test-games 4 \
            --seed 20260908 \
            --max-board-value 12 \
            --max-train-positions 24 \
            --max-test-positions 24 \
            --graph-nodes 5000 \
            --graph-ms 100 \
            --test-search-nodes 30000 \
            --test-search-ms 300 \
            --trajectory-pvs-nodes 5000 \
            --trajectory-mcts-sims 500 \
            | tee results/v6-tablebase-selfplay/generalization.json
      - uses: actions/upload-artifact@v4
        with:
          name: v6-tablebase-selfplay-generalization
          path: results/v6-tablebase-selfplay/*.json

  wdl-ab:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        wdl_max_board_value: [8, 12]
        placement: [leaf, all-low]
    name: wdl-ab (board=${{ matrix.wdl_max_board_value }}, placement=${{ matrix.placement }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Compare baseline PVS and hybrid WDL at equal total budget
        shell: bash
        run: |
          mkdir -p results/v6-ab
          npm run benchmark:v6:wdl-ab -- \
            --corpus-max-board-value 12 \
            --wdl-max-board-value "${{ matrix.wdl_max_board_value }}" \
            --placement "${{ matrix.placement }}" \
            --search-nodes 30000 \
            --search-ms 300 \
            --max-depth 12 \
            --wdl-graph-nodes 5000 \
            --wdl-ms 50 \
            --wdl-max-probes 4 \
            | tee "results/v6-ab/ab-b${{ matrix.wdl_max_board_value }}-${{ matrix.placement }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v6-ab-b${{ matrix.wdl_max_board_value }}-${{ matrix.placement }}
          path: results/v6-ab/*.json

  wdl-budget-sweep:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        max_board_value: [8, 12]
        graph_nodes: [5000, 10000, 20000, 50000]
    name: wdl-budget (board=${{ matrix.max_board_value }}, nodes=${{ matrix.graph_nodes }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe threefold graph-WDL budget coverage
        shell: bash
        run: |
          mkdir -p results/v6-wdl
          npm run benchmark:v6:wdl-graph -- \
            --max-board-value "${{ matrix.max_board_value }}" \
            --graph-nodes "${{ matrix.graph_nodes }}" \
            --graph-ms 500 \
            --max-probes-per-line 12 \
            | tee "results/v6-wdl/wdl-b${{ matrix.max_board_value }}-n${{ matrix.graph_nodes }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v6-wdl-budget-b${{ matrix.max_board_value }}-n${{ matrix.graph_nodes }}
          path: results/v6-wdl/*.json

  wdl-deep-coverage:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        max_board_value: [8, 12, 16]
        graph_nodes: [50000, 200000]
    name: wdl-deep (board=${{ matrix.max_board_value }}, nodes=${{ matrix.graph_nodes }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe deeper threefold graph-WDL coverage
        shell: bash
        run: |
          mkdir -p results/v6-wdl-deep
          npm run benchmark:v6:wdl-graph -- \
            --max-board-value "${{ matrix.max_board_value }}" \
            --graph-nodes "${{ matrix.graph_nodes }}" \
            --graph-ms 2000 \
            --max-probes-per-line 12 \
            | tee "results/v6-wdl-deep/wdl-b${{ matrix.max_board_value }}-n${{ matrix.graph_nodes }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v6-wdl-deep-b${{ matrix.max_board_value }}-n${{ matrix.graph_nodes }}
          path: results/v6-wdl-deep/*.json

  legacy-exact-coverage:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        oracle_mode: [policy, canonical-acyclic]
        max_board_value: [8, 12, 16]
        oracle_nodes: [5000, 50000]
    name: legacy-coverage (${{ matrix.oracle_mode }}, board=${{ matrix.max_board_value }}, nodes=${{ matrix.oracle_nodes }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Probe exact-margin oracle coverage
        shell: bash
        run: |
          mkdir -p results/v6
          MODE="${{ matrix.oracle_mode }}"
          npm run benchmark:v6:oracle-coverage -- \
            --policy repeat3 \
            --oracle-mode "$MODE" \
            --max-board-value "${{ matrix.max_board_value }}" \
            --oracle-nodes "${{ matrix.oracle_nodes }}" \
            --oracle-ms 100 \
            --max-probes-per-line 12 \
            | tee "results/v6/coverage-${MODE}-b${{ matrix.max_board_value }}-n${{ matrix.oracle_nodes }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v6-coverage-${{ matrix.oracle_mode }}-b${{ matrix.max_board_value }}-n${{ matrix.oracle_nodes }}
          path: results/v6/*.json
