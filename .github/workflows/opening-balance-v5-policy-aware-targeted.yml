name: opening-balance-v5-policy-aware-targeted

on:
  workflow_dispatch:
  push:
    branches:
      - research/repetition-policy-v5
    paths:
      - ".github/workflows/opening-balance-v5-policy-aware-targeted.yml"

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        policy: [repeat2, repeat3]
        pair:
          - aware-strategic__blind-strategic
          - aware-strategic__aware-material
    name: targeted (B3-CCW, ${{ matrix.policy }}, ${{ matrix.pair }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Run larger targeted repetition sample
        shell: bash
        run: |
          mkdir -p results/v5-aware-targeted
          PAIR="${{ matrix.pair }}"
          A="${PAIR%%__*}"
          B="${PAIR##*__}"
          npm run benchmark:openings:v5:policy-aware-selfplay -- \
            --opening "B3:CCW" \
            --policy "${{ matrix.policy }}" \
            --a "$A" \
            --b "$B" \
            --games 12 \
            --pvs-nodes 50000 \
            --pvs-depth 14 \
            --pvs-ms 500 \
            --production-nodes 50000 \
            --production-ms 500 \
            --max-moves 240 \
            --seed 202609081 \
            | tee "results/v5-aware-targeted/B3-CCW-${{ matrix.policy }}-${{ matrix.pair }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v5-targeted-B3-CCW-${{ matrix.policy }}-${{ matrix.pair }}
          path: results/v5-aware-targeted/*.json
