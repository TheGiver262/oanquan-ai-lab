name: v3a-challenger-screen

on:
  push:
    branches:
      - research/v3a-challenger-tournament
    paths:
      - .github/workflows/v3a-challenger-screen.yml
      - src/benchmarks/v3a-challenger-tournament.ts
      - src/research/mcts.ts
      - src/research/puct-v3a.ts
      - src/search.ts
      - src/engine.ts
      - src/research/v3-live-quan-corpus.ts
      - src/research/v3-balanced-midgame-corpus.ts
      - docs/research/V3A_CHALLENGER_TOURNAMENT_PROTOCOL_2026-09-17.md
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  screen:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        stage: [stage1, stage2, stage3]
        challenger: [uct, uct-pb, lab-minimax, lab-alpha-beta, v3a-null]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run V3A challenger screen
        run: >-
          npx tsx src/benchmarks/v3a-challenger-tournament.ts
          --stage ${{ matrix.stage }}
          --challenger ${{ matrix.challenger }}
          --time-budget-ms 600
          --simulation-cap 5000000
          --search-node-cap 5000000
          --rollout-depth 20
          --seed 20260917
          --replicate 1
          --out v3a-screen-${{ matrix.stage }}-${{ matrix.challenger }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a-screen-${{ matrix.stage }}-${{ matrix.challenger }}
          path: v3a-screen-${{ matrix.stage }}-${{ matrix.challenger }}.json
          retention-days: 7

  summarize:
    needs: screen
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v3a-screen-*
          path: screen-results
          merge-multiple: true
      - name: Build compact summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('screen-results').glob('v3a-screen-*.json'))
          rows = []
          payload = []
          for path in files:
              data = json.loads(path.read_text())
              payload.append(data)
              rows.append({
                  'stage': data['methodology']['stage'],
                  'challenger': data['methodology']['challenger'],
                  'W': data['challengerWins'],
                  'L': data['incumbentWins'],
                  'D': data['draws'],
                  'U': data['unresolved'],
                  'pairs': data['completedPairs'],
                  'mean': data['meanPairDiff'],
                  'median': data['medianPairDiff'],
                  'fav': data['favorablePairs'],
                  'neutral': data['neutralPairs'],
                  'unfav': data['unfavorablePairs'],
              })

          def fmt(value):
              return 'n/a' if value is None else f'{value:+.4f}'

          lines = [
              '# V3A Challenger Screen Summary',
              '',
              'Positive pairDiff favors the challenger; negative favors PUCT V3A.',
              '',
              '| Stage | Challenger | W-L-D-U | Completed pairs | Mean pairDiff | Median | F/N/U pairs |',
              '|---|---|---:|---:|---:|---:|---:|',
          ]
          for row in sorted(rows, key=lambda r: (r['stage'], r['challenger'])):
              lines.append(
                  f"| {row['stage']} | {row['challenger']} | {row['W']}-{row['L']}-{row['D']}-{row['U']} | "
                  f"{row['pairs']} | {fmt(row['mean'])} | {fmt(row['median'])} | "
                  f"{row['fav']}/{row['neutral']}/{row['unfav']} |"
              )

          Path('v3a-challenger-screen-summary.md').write_text('\n'.join(lines) + '\n')
          Path('v3a-challenger-screen-combined.json').write_text(json.dumps(payload, indent=2) + '\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3a-challenger-screen-summary
          path: |
            v3a-challenger-screen-summary.md
            v3a-challenger-screen-combined.json
          retention-days: 7
