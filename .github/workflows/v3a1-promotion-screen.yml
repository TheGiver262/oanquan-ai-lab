name: v3a1-promotion-screen

on:
  push:
    branches:
      - research/puct-v3a1-leaf-score
    paths:
      - ".github/workflows/v3a1-promotion-screen.yml"
      - "src/research/puct-v3a.ts"
      - "tests/puct-v3a.test.ts"
      - "src/benchmarks/v3a1-vs-v3a-fixed.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  screen:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        stage: [stage1, stage2, stage3]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: V3A.1 leaf0 vs incumbent V3A
        run: |
          npx tsx src/benchmarks/v3a1-vs-v3a-fixed.ts \
            --stage "${{ matrix.stage }}" \
            --fixed-simulations 10000 \
            --candidate-leaf-score-weight 0 \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-promotion-${{ matrix.stage }}
          path: result.json
          retention-days: 7

  summarize:
    needs: screen
    if: always() && needs.screen.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v3a1-promotion-*
          path: results
      - name: Build promotion summary
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for path in glob.glob("results/**/result.json",recursive=True):
              with open(path,encoding="utf-8") as f:
                  rows.append(json.load(f))
          rows.sort(key=lambda r:r["methodology"]["stage"])
          md=[
            "# V3A.1 leaf0 promotion screen",
            "",
            "Equal fixed simulations per decision; each position is seat-swapped.",
            "",
            "| stage | games | cand W | inc W | draws | unresolved | resolved score | pairs +/=/- | mean pair diff |",
            "|---|---:|---:|---:|---:|---:|---:|---|---:|",
          ]
          total={"games":0,"cw":0,"iw":0,"draws":0,"unres":0,"pairs":[]}
          for r in rows:
              md.append(
                f'| {r["methodology"]["stage"]} | {r["games"]} | {r["candidateWins"]} | {r["incumbentWins"]} | '
                f'{r["draws"]} | {r["unresolved"]} | {r["resolvedScoreRate"] if r["resolvedScoreRate"] is not None else "-"} | '
                f'{r["favorablePairs"]}/{r["neutralPairs"]}/{r["unfavorablePairs"]} | {r["meanPairDiff"] if r["meanPairDiff"] is not None else "-"} |'
              )
              total["games"]+=r["games"]; total["cw"]+=r["candidateWins"]; total["iw"]+=r["incumbentWins"]
              total["draws"]+=r["draws"]; total["unres"]+=r["unresolved"]; total["pairs"]+=r["pairDiffs"]
          p=total["pairs"]
          md += ["",f'- Aggregate resolved W-D-L: **{total["cw"]}-{total["draws"]}-{total["iw"]}**',
                 f'- Aggregate unresolved: **{total["unres"]}**',
                 f'- Aggregate completed-pair mean diff: **{sum(p)/len(p) if p else "n/a"}**']
          open("v3a1-promotion-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(rows,open("v3a1-promotion-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-promotion-summary
          path: |
            v3a1-promotion-summary.md
            v3a1-promotion-summary.json
          retention-days: 7
