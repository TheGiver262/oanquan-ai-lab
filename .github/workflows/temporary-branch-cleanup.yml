name: temporary-branch-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete temporary research branch
        run: git push origin --delete research/v3a2-qg-causal-audit || true
