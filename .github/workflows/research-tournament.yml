name: legacy-reference-tournament

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Even number of games per matchup"
        required: false
        default: "6"

# Legacy generic-lab reference only. Do not use this workflow for claims about
# the production game bots. Use server-production-tournament.yml instead.
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [uct, uct-pb]
        opponent: [tham-hoa, bang-nhan, trang-nguyen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Run legacy seat-balanced tournament
        run: |
          mkdir -p results
          npm run benchmark:research -- \
            --variant ${{ matrix.variant }} \
            --opponent ${{ matrix.opponent }} \
            --games ${{ inputs.games || '6' }} \
            --out results/legacy-${{ matrix.variant }}-vs-${{ matrix.opponent }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.variant }}-vs-${{ matrix.opponent }}
          path: results/legacy-${{ matrix.variant }}-vs-${{ matrix.opponent }}.json
