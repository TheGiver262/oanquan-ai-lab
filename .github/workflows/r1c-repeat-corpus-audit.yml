name: r1c-repeat-corpus-audit

on:
  push:
    branches:
      - research/r1c-repeat-parity
    paths:
      - ".github/workflows/r1c-repeat-corpus-audit.yml"
      - "src/benchmarks/r1c-repeat-corpus-audit.ts"
      - "src/research/v3-live-quan-corpus.ts"
      - "src/research/v3-balanced-midgame-corpus.ts"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/v3-live-quan-corpus.test.ts tests/v3-balanced-midgame-corpus.test.ts
      - run: npm run build
      - name: Dump repeat-aware corpus identities
        run: npx tsx src/benchmarks/r1c-repeat-corpus-audit.ts --out r1c-repeat-corpus-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1c-repeat-corpus-audit
          path: r1c-repeat-corpus-audit.json
