name: r1a-production-parity

on:
  push:
    branches:
      - research/r1-production-parity
    paths:
      - ".github/workflows/r1a-production-parity.yml"
      - "src/engine.ts"
      - "src/reference/server-production-ai.ts"
      - "tests/server-production-parity.test.ts"
      - "README.md"
      - "docs/r1a-production-parity-audit.md"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/server-production-parity.test.ts tests/engine.test.ts tests/opening-pie-analysis.test.ts
      - run: npm run build
