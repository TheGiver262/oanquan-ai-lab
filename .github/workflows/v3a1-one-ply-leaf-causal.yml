name: v3a1-one-ply-leaf-causal

on:
  push:
    branches:
      - research/puct-v3a1-leaf-score
    paths:
      - ".github/workflows/v3a1-one-ply-leaf-causal.yml"
      - "src/research/mode-aware-puct-v3a.ts"
      - "src/benchmarks/v3a1-leaf-score-root-ablation.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  causal:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: move2-static
            case_id: move2
            budget: 99066
            bootstrap: static
          - id: move2-oneply
            case_id: move2
            budget: 99066
            bootstrap: one_ply
          - id: move34-static
            case_id: move34
            budget: 90000
            bootstrap: static
          - id: move34-oneply
            case_id: move34
            budget: 90000
            bootstrap: one_ply
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run one-ply leaf causal probe
        run: |
          npx tsx src/benchmarks/v3a1-leaf-score-root-ablation.ts \
            --case "${{ matrix.case_id }}" \
            --fixed-simulations "${{ matrix.budget }}" \
            --leaf-score-weight 1.8 \
            --leaf-bootstrap "${{ matrix.bootstrap }}" \
            --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-oneply-${{ matrix.id }}
          path: result.json
          retention-days: 7

  summarize:
    needs: causal
    if: always() && needs.causal.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v3a1-oneply-*
          path: results
      - name: Build one-ply summary
        run: |
          python - <<'PY'
          import glob,json
          rows=[]
          for p in glob.glob("results/**/result.json",recursive=True):
              with open(p,encoding="utf-8") as f: rows.append(json.load(f))
          rows.sort(key=lambda r:(r["methodology"]["caseId"],r["methodology"]["leafBootstrap"]))
          md=["# V3A.1 one-ply leaf causal audit","",
              "| case | bootstrap | selected | focus A rank/visits/mean | focus B rank/visits/mean |",
              "|---|---|---|---|---|"]
          for r in rows:
              a,b=r["focus"]
              def fmt(x):
                  s=x["stats"]
                  return f'{s["rank"]}/{s["visits"]}/{s["meanValue"]:.6f}' if s else "-"
              md.append(f'| {r["methodology"]["caseId"]} | {r["methodology"]["leafBootstrap"]} | {r["selectedAction"]} | {a["action"]} {fmt(a)} | {b["action"]} {fmt(b)} |')
          open("v3a1-one-ply-causal-summary.md","w",encoding="utf-8").write("\n".join(md)+"\n")
          json.dump(rows,open("v3a1-one-ply-causal-summary.json","w",encoding="utf-8"),indent=2)
          print("\n".join(md))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3a1-one-ply-causal-summary
          path: |
            v3a1-one-ply-causal-summary.md
            v3a1-one-ply-causal-summary.json
          retention-days: 7
