name: r1c-live-quan-stage2

on:
  push:
    branches:
      - research/r1c-ai-promotion
    paths:
      - ".github/workflows/r1c-live-quan-stage2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/puct-v2.test.ts tests/puct-v3a.test.ts tests/v3-live-quan-corpus.test.ts tests/server-production-parity.test.ts
      - run: npm run build

  ablation:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v2-null-live-quan
            candidate: puct-v2
            baseline: puct-v2
          - id: v3a-vs-v2-live-quan
            candidate: puct-v3a
            baseline: puct-v2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run deterministic live-Quan paired ablation
        run: >-
          npx tsx src/benchmarks/r1c-live-quan-ablation.ts
          --candidate ${{ matrix.candidate }}
          --baseline ${{ matrix.baseline }}
          --simulations 4000
          --additional-max-moves 160
          --out r1c-${{ matrix.id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1c-${{ matrix.id }}
          path: r1c-${{ matrix.id }}.json
