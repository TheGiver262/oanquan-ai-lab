name: temporary-v3m-run-prune

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v3m-run-prune.yml"

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ids = [
              36337101851,
              36337039515, 36337035611, 36337032141,
              36336850121, 36336846734,
              36336696334,
              36336438522, 36336434679, 36336390495,
              36336296204, 36336250845, 36336250758, 36336247773,
              36336138043, 36336137964, 36336135014,
              36336094449,
              36335927264, 36335908314, 36335905270,
              36335828129, 36335790781,
              36318004350, 36317979528, 36317979513
            ];
            for (const run_id of ids) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id,
                });
              } catch (error) {
                core.warning(`Could not delete run ${run_id}: ${error.message}`);
              }
            }
