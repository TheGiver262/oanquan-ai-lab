name: r1b-rules-calibration

on:
  push:
    branches:
      - research/r1b-pie-vs-cam-quan
    paths:
      - ".github/workflows/r1b-rules-calibration.yml"
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run all-opening low-budget calibration
        run: >-
          npm run benchmark:r1b:rules --
          --rule both
          --engine-x uct
          --engine-y uct-pb
          --simulations 256
          --rollout-depth 12
          --max-moves 160
          --seed 20260914
          --out r1b-calibration.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1b-rules-calibration
          path: r1b-calibration.json
