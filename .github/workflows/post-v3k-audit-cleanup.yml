name: temporary-post-v3k-audit-cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/post-v3k-audit-cleanup.yml"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Delete temporary diagnostic branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/research/post-v3k-root-cause-audit" || true

      - name: Prune redundant completed Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          KEEP="36301281043 36301278087 36299270925 36299188617 36299084469 36299032091 36298967210 36298934688 36293193725 36293156392"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"             --jq '.workflow_runs[] | select(.status=="completed") | .id' |
          while read -r id; do
            [ -n "$id" ] || continue
            [ "$id" = "$CURRENT_RUN" ] && continue
            case " $KEEP " in
              *" $id "*) continue ;;
            esac
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
          done

      - name: Remove temporary cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/post-v3k-audit-cleanup.yml
          git commit -m "chore: remove post-V3K audit cleanup workflow"
          git push origin HEAD:main
