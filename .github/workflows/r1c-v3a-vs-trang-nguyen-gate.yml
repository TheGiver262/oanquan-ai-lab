name: r1c-v3a-vs-trang-nguyen-gate

on:
  push:
    branches:
      - research/r1c-repeat-parity
    paths:
      - ".github/workflows/r1c-v3a-vs-trang-nguyen-gate.yml"
      - "src/benchmarks/r1c-v3a-vs-trang-nguyen.ts"
      - "src/reference/**"
      - "src/research/puct-v3a.ts"
      - "src/research/v3-live-quan-corpus.ts"
      - "src/research/v3-balanced-midgame-corpus.ts"
      - "src/engine.ts"
      - "tests/server-production-parity.test.ts"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/engine.test.ts tests/server-production-parity.test.ts tests/puct-v3a.test.ts tests/v3-live-quan-corpus.test.ts tests/v3-balanced-midgame-corpus.test.ts
      - run: npm run build

  gate:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        stage: [stage1, stage2, stage3]
        matchup: [tn-null, v3a-vs-tn]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Resolve candidate
        id: candidate
        shell: bash
        run: |
          if [ "${{ matrix.matchup }}" = "tn-null" ]; then
            echo "engine=trang-nguyen" >> "$GITHUB_OUTPUT"
          else
            echo "engine=v3a" >> "$GITHUB_OUTPUT"
          fi
      - name: Run production-envelope runtime replicate 1
        run: >-
          npx tsx src/benchmarks/r1c-v3a-vs-trang-nguyen.ts
          --stage ${{ matrix.stage }}
          --candidate ${{ steps.candidate.outputs.engine }}
          --time-budget-ms 1200
          --production-nodes 100000
          --simulation-cap 5000000
          --replicate 1
          --out r1c-tn-${{ matrix.stage }}-${{ matrix.matchup }}-r1.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1c-tn-${{ matrix.stage }}-${{ matrix.matchup }}-r1
          path: r1c-tn-${{ matrix.stage }}-${{ matrix.matchup }}-r1.json
