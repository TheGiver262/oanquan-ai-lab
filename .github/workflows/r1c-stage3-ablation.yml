name: r1c-stage3-ablation

on:
  push:
    branches:
      - research/r1c-ai-promotion
    paths:
      - ".github/workflows/r1c-stage3-ablation.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npx vitest run tests/puct-v2.test.ts tests/puct-v3a.test.ts tests/v3-balanced-midgame-corpus.test.ts tests/server-production-parity.test.ts
      - run: npm run build

  ablation:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: v2-null-stage3
            candidate: puct-v2
            baseline: puct-v2
          - label: v3a-vs-v2-stage3
            candidate: puct-v3a
            baseline: puct-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run low-material cycle-sensitive ablation
        run: >-
          npx tsx src/benchmarks/r1c-stage3-ablation.ts
          --candidate ${{ matrix.candidate }}
          --baseline ${{ matrix.baseline }}
          --simulations 4000
          --additional-max-moves 512
          --out ${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1c-${{ matrix.label }}
          path: ${{ matrix.label }}.json
